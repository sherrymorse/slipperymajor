<!DOCTYPE html>
<html lang="en" data-theme="studio" data-tone="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2EFEA">
<title>ALL·TIMERS — rank the things you love</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237C7CF5'/%3E%3Cstop offset='1' stop-color='%23E78AD8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-size='38' font-weight='700' text-anchor='middle' fill='white'%3E1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..800,0..100,0..1;1,9..144,300..800,0..100,0..1&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Geist:wght@400..900&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ALL·TIMERS v4 — tokens
   ============================================================ */
@property --amb1 { syntax: '<color>'; inherits: false; initial-value: #c9d6ff; }
@property --amb2 { syntax: '<color>'; inherits: false; initial-value: #ffd6e5; }
@property --amb3 { syntax: '<color>'; inherits: false; initial-value: #fff1c9; }

:root{
  --font-display:"Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-body:"Instrument Sans", "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --font-mono:"Spline Sans Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --font-num:"Geist", "Inter Tight", "SF Pro Display", -apple-system, system-ui, sans-serif;
  --soft:"SOFT" 100, "WONK" 0;
  --r-xl:30px; --r-lg:22px; --r-md:16px; --r-sm:11px;
  --ease:cubic-bezier(.22,.9,.3,1);
  --spring:cubic-bezier(.2,1.25,.35,1);
  --speed:.25s;
  --up:#25B26B; --down:#E5484D;
}
[data-tone="light"]{
  --glow-base:#ffffff; --glow-amt:50%; --amb-amt:72%; --grain:.28;
  --hl:rgba(255,255,255,.8); --sh:70 50 30;
  --shadow-1:0 1px 2px rgb(var(--sh) / .05), 0 12px 28px -16px rgb(var(--sh) / .30);
  --shadow-2:0 2px 4px rgb(var(--sh) / .06), 0 26px 50px -24px rgb(var(--sh) / .42);
  --glass:color-mix(in oklab, var(--surface) 95%, transparent);
}
[data-tone="dark"]{
  --glow-base:#05060b; --glow-amt:62%; --amb-amt:60%; --grain:.45;
  --hl:rgba(255,255,255,.07); --sh:0 0 0;
  --shadow-1:0 1px 2px rgb(0 0 0 / .3), 0 14px 30px -16px rgb(0 0 0 / .65);
  --shadow-2:0 2px 4px rgb(0 0 0 / .35), 0 28px 56px -24px rgb(0 0 0 / .8);
  --glass:color-mix(in oklab, var(--surface) 95%, transparent);
}

/* ---- Themes (ids kept from v1–v3 so saved lists keep their look) ---- */
[data-theme="studio"]{      /* Porcelain */
  --bg:#F2EFEA; --surface:#FFFDFA; --surface-2:#F5F1EB;
  --line:rgba(60,40,20,.09); --ink:#1E1B18; --ink-dim:#7C736B;
  --accent:#6464EE; --accent-2:#D07BE6; --accent-ink:#FFFFFF; --rank:#D8D0C6;
  --t-amb1:#C9D4FF; --t-amb2:#FFD3E4; --t-amb3:#FFEFC4;
}
[data-theme="marquee"]{     /* Velvet */
  --bg:#150F0B; --surface:#211812; --surface-2:#2A1F17;
  --line:rgba(255,225,190,.08); --ink:#F8ECDE; --ink-dim:#AC987F;
  --accent:#F3BA68; --accent-2:#F0866A; --accent-ink:#2A170A; --rank:#4A3A2C;
  --t-amb1:#6B3A1E; --t-amb2:#5E2235; --t-amb3:#4A3A12;
}
[data-theme="broadcast"]{   /* Midnight */
  --bg:#0B0F22; --surface:#141934; --surface-2:#1A2042;
  --line:rgba(190,205,255,.09); --ink:#EAEFFF; --ink-dim:#929BC6;
  --accent:#7DE8D4; --accent-2:#8FA8FF; --accent-ink:#06231D; --rank:#2D3564;
  --t-amb1:#22307A; --t-amb2:#0E5560; --t-amb3:#43257A;
}
[data-theme="stadium"]{     /* Matcha */
  --bg:#EDF1E7; --surface:#FBFDF7; --surface-2:#F0F4EA;
  --line:rgba(40,60,30,.10); --ink:#1B2618; --ink-dim:#6D7A66;
  --accent:#3E9160; --accent-2:#B6C84A; --accent-ink:#FFFFFF; --rank:#CCD7C2;
  --t-amb1:#CDEBC0; --t-amb2:#F2EEB8; --t-amb3:#C3E5DE;
}
[data-theme="neon"]{        /* Berry */
  --bg:#160A1B; --surface:#221127; --surface-2:#2B1631;
  --line:rgba(255,200,240,.09); --ink:#FCEBF7; --ink-dim:#B793B2;
  --accent:#FF7DB8; --accent-2:#B38DFF; --accent-ink:#2A0A1C; --rank:#4A2650;
  --t-amb1:#6A1D55; --t-amb2:#33207A; --t-amb3:#7A2843;
}
[data-theme="ledger"]{      /* Oat */
  --bg:#F3EDE1; --surface:#FFFBF3; --surface-2:#F5EEE1;
  --line:rgba(70,50,20,.10); --ink:#2A2519; --ink-dim:#867B67;
  --accent:#BC6A3E; --accent-2:#DDA645; --accent-ink:#FFFFFF; --rank:#DCD0BA;
  --t-amb1:#F7D6BF; --t-amb2:#F0E2B2; --t-amb3:#E2D4EF;
}

/* ============================================================
   Base
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  transition:background-color .5s var(--ease), color .5s var(--ease);
}
.ambient{
  --amb1:var(--t-amb1); --amb2:var(--t-amb2); --amb3:var(--t-amb3);
  position:fixed;inset:-12%;z-index:0;pointer-events:none;
  opacity:0;transition:opacity 1.3s var(--ease);will-change:opacity;
  background:
    radial-gradient(38% 46% at 12% 8%,  color-mix(in oklab, var(--amb1) var(--amb-amt), transparent), transparent 72%),
    radial-gradient(42% 50% at 92% 12%, color-mix(in oklab, var(--amb2) var(--amb-amt), transparent), transparent 72%),
    radial-gradient(50% 55% at 55% 102%, color-mix(in oklab, var(--amb3) var(--amb-amt), transparent), transparent 72%);
}
.ambient.on{opacity:1}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font-family:inherit}
::selection{background:color-mix(in oklab, var(--accent) 40%, transparent);color:var(--ink)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.display{font-family:var(--font-display);font-variation-settings:var(--soft)}

.app{position:relative;z-index:1;max-width:940px;margin:0 auto;padding:30px 24px 70px}

/* ---- Top bar ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:38px}
.wordmark{
  font-family:var(--font-display);font-variation-settings:var(--soft);font-weight:640;font-size:23px;
  letter-spacing:-.01em;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:10px;
}
.wordmark .mark{
  width:30px;height:30px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));color:var(--accent-ink);
  font-size:17px;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 8px 18px -8px color-mix(in oklab, var(--accent) 80%, transparent);
}
.wordmark .dot{color:var(--accent)}
.topbar-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}

.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink-dim);padding:0 6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--up);flex:none;box-shadow:0 0 0 3px color-mix(in oklab, var(--up) 22%, transparent)}
.sync.saving i{background:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab, var(--accent) 22%, transparent);animation:pulse 1s ease-in-out infinite}
.sync.offline i{background:var(--down);box-shadow:0 0 0 3px color-mix(in oklab, var(--down) 22%, transparent)}
@keyframes pulse{50%{opacity:.3}}

/* ---- Buttons ---- */
.btn{
  border:none;background:color-mix(in oklab, var(--ink) 7%, transparent);color:var(--ink);
  border-radius:999px;padding:9px 17px;font-size:13.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;
  transition:transform .3s var(--spring), background var(--speed), box-shadow var(--speed);
}
.btn:hover{transform:translateY(-1px);background:color-mix(in oklab, var(--ink) 11%, transparent)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.btn-accent{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 10px 22px -10px color-mix(in oklab, var(--accent) 85%, transparent);
}
.btn-accent:hover{border-color:transparent;filter:saturate(1.1) brightness(1.04)}
.btn-ghost{background:transparent;box-shadow:none}
.btn-ghost:hover{background:color-mix(in oklab, var(--ink) 7%, transparent)}
.btn svg{width:15px;height:15px;flex:none}
:focus-visible{outline:2.5px solid color-mix(in oklab, var(--accent) 70%, transparent);outline-offset:3px;border-radius:12px}

.iconbtn{
  width:34px;height:34px;border-radius:12px;border:1px solid transparent;
  background:transparent;color:var(--ink-dim);
  display:inline-flex;align-items:center;justify-content:center;
  transition:background var(--speed), color var(--speed), border-color var(--speed), transform .3s var(--spring);
}
.iconbtn:hover{background:color-mix(in oklab, var(--ink) 7%, transparent);color:var(--ink)}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:16px;height:16px}
.iconbtn.danger:hover{color:var(--down)}
.iconbtn:disabled{opacity:.3;cursor:default}

.seg{display:inline-flex;padding:3px;border-radius:999px;background:color-mix(in oklab, var(--ink) 6%, transparent);gap:2px}
.seg-btn{
  border:none;background:transparent;color:inherit;font-size:12px;font-weight:650;
  padding:6px 12px;border-radius:999px;opacity:.7;display:inline-flex;align-items:center;gap:5px;
  transition:background var(--speed), opacity var(--speed), box-shadow var(--speed);
}
.seg-btn svg{width:12px;height:12px}
.seg-btn:hover{opacity:1}
.seg-btn.active{opacity:1;background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(var(--sh) / .12), 0 4px 10px -4px rgb(var(--sh) / .2)}
.seg-btn:disabled{opacity:.25;cursor:default}

/* ============================================================
   Home
   ============================================================ */
.eyebrow{font-size:11.5px;font-weight:650;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim)}
.home-hero{margin:6px 0 34px}
.home-hero h1{
  font-family:var(--font-display);font-variation-settings:var(--soft);font-weight:520;
  font-size:clamp(50px,10vw,104px);line-height:.92;margin:12px 0 18px;letter-spacing:-.035em;
}
.home-hero h1 em{
  font-style:italic;font-weight:480;
  background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;
  padding-right:.08em;
}
.home-hero p{max-width:54ch;color:var(--ink-dim);font-size:16.5px;line-height:1.6;margin:0}
.home-stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:22px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim)}
.home-stats b{font-family:var(--font-display);font-variation-settings:var(--soft);font-weight:560;font-size:30px;letter-spacing:-.02em;color:var(--ink);margin-right:8px;vertical-align:-4px;text-transform:none}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:18px}
.list-card{
  position:relative;border:none;border-radius:var(--r-xl);
  background:var(--surface);color:var(--ink);cursor:pointer;
  padding:20px 20px 18px;text-align:left;width:100%;overflow:hidden;
  box-shadow:var(--shadow-1);
  transition:transform .4s var(--spring), box-shadow .3s var(--ease);
}
.list-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-2)}
.card-art{display:grid;height:118px;margin:-20px -20px 16px;overflow:hidden;position:relative;background:var(--surface-2)}
.card-art img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block;transition:transform .8s var(--ease)}
.list-card:hover .card-art img{transform:scale(1.06)}
.card-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,var(--surface) 97%)}
.card-eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.list-card h3{
  font-family:var(--font-display);font-variation-settings:var(--soft);font-weight:560;font-size:25px;line-height:1.05;
  margin:0 0 14px;letter-spacing:-.02em;
}
.card-preview{display:grid;gap:7px}
.card-preview .pv{display:flex;gap:10px;align-items:baseline;font-size:13px;color:var(--ink-dim);white-space:nowrap;overflow:hidden}
.card-preview .pv span{overflow:hidden;text-overflow:ellipsis}
.card-preview .pv b{font-family:var(--font-num);font-weight:750;color:var(--ink-dim);font-size:15px;min-width:14px;flex:none}
.card-preview .pv:first-child b{background:linear-gradient(140deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.card-preview .pv:first-child span{color:var(--ink);font-weight:650}
.card-meta{
  margin-top:16px;padding-top:12px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:600;color:var(--ink-dim);
}
.card-count{color:var(--ink)}
.card-del{position:absolute;top:12px;right:12px;opacity:0;z-index:2;background:var(--surface);box-shadow:var(--shadow-1)}
.list-card:hover .card-del,.card-del:focus-visible{opacity:1}

.new-card{
  border:1.5px dashed color-mix(in oklab, var(--ink) 16%, transparent);border-radius:var(--r-xl);background:transparent;
  min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;color:var(--ink-dim);font-weight:650;font-size:14px;
  transition:border-color var(--speed), color var(--speed), background var(--speed), transform .4s var(--spring);
}
.new-card:hover{border-color:var(--accent);color:var(--accent);background:var(--glass);transform:translateY(-3px)}
.new-card .plus{
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));color:var(--accent-ink);
  box-shadow:0 10px 22px -10px color-mix(in oklab, var(--accent) 80%, transparent);
}

/* ============================================================
   List view
   ============================================================ */
.list-head{margin:8px 0 22px}
.list-head .eyebrow{display:flex;align-items:center;gap:12px}
.list-head .eyebrow::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--line),transparent)}
.list-title{
  font-family:var(--font-display);font-variation-settings:var(--soft);font-weight:560;
  font-size:clamp(42px,7.6vw,80px);line-height:.98;letter-spacing:-.035em;
  margin:14px 0 10px;outline:none;border-radius:10px;
}
.list-title:focus{box-shadow:0 0 0 3px color-mix(in oklab, var(--accent) 40%, transparent)}
.list-sub{color:var(--ink-dim);font-size:16px;line-height:1.55;max-width:62ch;outline:none;border-radius:8px;min-height:1.5em}
.list-sub:empty::before{content:attr(data-placeholder);color:var(--ink-dim);opacity:.55}
.list-sub:focus{box-shadow:0 0 0 3px color-mix(in oklab, var(--accent) 40%, transparent)}

.list-toolbar{
  position:sticky;top:12px;z-index:25;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  margin:22px 0 26px;padding:8px 8px 8px 16px;border-radius:999px;
  background:var(--glass);box-shadow:var(--shadow-1);
}
.toolbar-right{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.swatches{display:flex;gap:8px;align-items:center}
.swatch{
  width:24px;height:24px;border-radius:50%;border:none;padding:0;position:relative;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.5), 0 2px 6px -2px rgb(var(--sh) / .4);
  transition:transform .35s var(--spring);
}
.swatch:hover{transform:scale(1.18)}
.swatch.active{box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--ink)}
.find{
  display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;color:var(--ink-dim);
  background:color-mix(in oklab, var(--ink) 5%, transparent);transition:background var(--speed), box-shadow var(--speed);
}
.find:focus-within{background:var(--surface);box-shadow:0 0 0 3px color-mix(in oklab, var(--accent) 30%, transparent)}
.find svg{width:14px;height:14px;flex:none}
.find input{border:none;background:transparent;color:var(--ink);width:120px;font-size:13.5px;outline:none;padding:0}
.find input::-webkit-search-cancel-button{display:none}
.find-count{font-size:11px;font-weight:650;white-space:nowrap}
.tb-sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.enrich-btn{padding:8px 14px}

/* ---- Ranked rows ---- */
.rank-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.rank-row{
  --p1:var(--rank); --p2:var(--rank); --p3:var(--rank);
  position:relative;isolation:isolate;
  display:grid;grid-template-columns:80px 1fr auto;align-items:center;gap:12px;
  background:var(--surface);
  border:none;border-radius:var(--r-lg);
  padding:12px 12px 12px 0;min-height:94px;
  box-shadow:var(--shadow-1);
  overflow:hidden;
  scroll-margin:110px 0 200px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  transition:box-shadow .35s var(--ease), opacity .3s;
}
.rank-row.has-art{grid-template-columns:80px 62px 1fr auto}
.rank-row:hover{box-shadow:var(--shadow-2)}
.rank-row > :not(.row-bg):not(.row-scrim):not(.bloom){position:relative;z-index:1}

/* podium */
.rank-row.is-top{min-height:164px;padding:16px 16px 16px 0;border-radius:var(--r-xl);
  box-shadow:var(--shadow-2), 0 34px 70px -40px color-mix(in oklab, var(--p1) 90%, transparent);}
.rank-row.is-top,.rank-row.is-top.has-art{grid-template-columns:116px 1fr auto}
.rank-row.is-top.has-art{grid-template-columns:116px 102px 1fr auto}
.rank-row.is-podium.has-art{grid-template-columns:86px 68px 1fr auto}
.rank-row.is-podium{grid-template-columns:86px 1fr auto;min-height:110px}

/* ---- looks ---- */
.rank-row.look-tint{
  background:
    radial-gradient(90% 160% at 0% 50%, color-mix(in oklab, color-mix(in oklab, var(--p1) var(--glow-amt), var(--glow-base)) 55%, transparent), transparent 70%),
    var(--surface);
}
.rank-row.look-glow{
  background:
    radial-gradient(70% 150% at 4% 0%,   color-mix(in oklab, var(--p1) var(--glow-amt), var(--glow-base)), transparent 70%),
    radial-gradient(60% 140% at 100% 0%, color-mix(in oklab, var(--p2) var(--glow-amt), var(--glow-base)), transparent 72%),
    radial-gradient(70% 160% at 55% 135%, color-mix(in oklab, var(--p3) var(--glow-amt), var(--glow-base)), transparent 70%),
    color-mix(in oklab, var(--p1) 14%, var(--surface));
}
.rank-row.look-scene{color:#fff}
.row-bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center 30%;
  background-color:color-mix(in oklab, var(--p1) 45%, #05060a);transition:opacity .6s var(--ease)}
.row-scrim{position:absolute;inset:0;z-index:0;
  background:linear-gradient(92deg,
    color-mix(in oklab, var(--p1) 50%, rgba(4,5,9,.96)) 0%,
    color-mix(in oklab, var(--p1) 28%, rgba(4,5,9,.80)) 36%,
    rgba(4,5,9,.28) 100%);}
.rank-row.look-scene .row-note{color:rgba(255,255,255,.78)}
.rank-row.look-scene .iconbtn{color:rgba(255,255,255,.82)}
.rank-row.look-scene .iconbtn:hover{background:rgba(255,255,255,.16);color:#fff}
.rank-row.look-scene .row-title{text-shadow:0 1px 14px rgba(0,0,0,.45)}
.rank-row.look-bold{
  color:var(--row-ink,#fff);
  background:linear-gradient(180deg, rgba(255,255,255,.16), transparent 55%), linear-gradient(118deg, var(--p1) 0%, var(--p2) 85%);
}
.rank-row.look-bold .row-note{color:inherit;opacity:.8}
.rank-row.look-bold .iconbtn{color:inherit;opacity:.85}
.rank-row.look-bold .iconbtn:hover{background:rgba(127,127,127,.22);opacity:1}

/* ---- numerals ---- */
.rank-num{
  font-family:var(--font-num);font-weight:700;font-feature-settings:"tnum" 1;
  font-size:44px;line-height:1;letter-spacing:-.06em;
  color:color-mix(in oklab, var(--p1) 50%, var(--ink-dim));
  text-align:center;user-select:none;-webkit-user-select:none;font-variant-numeric:lining-nums tabular-nums;
  cursor:pointer;align-self:stretch;display:flex;align-items:center;justify-content:center;
  border-radius:14px;transition:color .3s;
}
.rank-row.is-podium .rank-num{font-size:52px;font-weight:750}
.rank-row.is-top .rank-num{
  font-size:92px;font-weight:800;letter-spacing:-.07em;padding-right:.06em;
  background:linear-gradient(165deg,var(--accent) 10%,var(--accent-2) 90%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 8px 18px color-mix(in oklab, var(--accent) 35%, transparent));
}
.rank-row.look-scene .rank-num,.rank-row.look-bold .rank-num{color:rgba(255,255,255,.62)}
.rank-row.look-bold .rank-num{color:color-mix(in oklab, var(--row-ink,#fff) 62%, transparent)}
.rank-row.look-scene.is-top .rank-num,.rank-row.look-bold.is-top .rank-num{background:linear-gradient(165deg,#fff,rgba(255,255,255,.7));-webkit-background-clip:text;background-clip:text;color:transparent}
.rank-jump{
  width:72%;max-width:70px;min-width:0;
  background:var(--surface);color:var(--ink);border:none;border-radius:14px;
  box-shadow:0 0 0 2px var(--accent), 0 10px 24px -10px rgb(var(--sh) / .5);
  font-family:var(--font-num);font-weight:750;font-size:28px;letter-spacing:-.04em;text-align:center;padding:6px 0;outline:none;-webkit-user-select:text;user-select:text;
}

.row-art{
  width:62px;height:88px;border-radius:13px;overflow:hidden;flex:none;
  background:color-mix(in oklab, var(--p1) 35%, var(--surface-2));
  box-shadow:0 14px 26px -12px color-mix(in oklab, var(--p1) 75%, rgb(var(--sh))), 0 2px 5px rgb(var(--sh) / .18);
}
.row-art img{width:100%;height:100%;object-fit:cover;display:block}
.rank-row.is-podium .row-art{width:68px;height:97px;border-radius:15px}
.rank-row.is-top .row-art{width:102px;height:146px;border-radius:19px;
  box-shadow:0 26px 44px -18px color-mix(in oklab, var(--p1) 85%, rgb(var(--sh))), 0 3px 8px rgb(var(--sh) / .22)}

.row-body{min-width:0;padding-right:6px}
.row-title{font-weight:650;font-size:17.5px;line-height:1.25;letter-spacing:-.01em;overflow-wrap:anywhere}
.row-note{color:var(--ink-dim);font-size:13.5px;line-height:1.45;margin-top:4px;overflow-wrap:anywhere}
.rank-row.is-podium .row-title{font-size:19.5px}
.rank-row.is-top .row-title{font-family:var(--font-display);font-variation-settings:var(--soft);font-weight:580;font-size:32px;line-height:1.05;letter-spacing:-.025em}
.rank-row.is-top .row-note{font-size:14.5px;margin-top:8px}
.crown{display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;font-size:10.5px;font-weight:750;letter-spacing:.16em;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}

.row-ctl{display:flex;align-items:center;gap:2px;opacity:0;transition:opacity var(--speed)}
.rank-row:hover .row-ctl,.rank-row:focus-within .row-ctl{opacity:1}
.row-ctl .iconbtn{width:38px;height:38px;border-radius:13px}
.drag-handle{cursor:grab}
.drag-handle:active{cursor:grabbing}
@media (hover:none){
  .row-ctl{opacity:1}
  .row-ctl .drag-handle{display:none}
  .row-ctl .more-btn{width:44px;height:44px;background:color-mix(in oklab, currentColor 9%, transparent)}
}

/* unranked */
.unranked-head{list-style:none;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:26px 2px 4px}
.unranked-head h4{font-family:var(--font-display);font-variation-settings:var(--soft);font-style:italic;font-weight:500;font-size:28px;letter-spacing:-.02em;margin:0}
.unranked-head .u-sub{color:var(--ink-dim);font-size:13.5px}
.unranked-head .btn{margin-left:auto}
.rank-row.unranked{min-height:80px}
.rank-row.unranked .rank-num{font-size:30px;font-weight:500;color:color-mix(in oklab, var(--ink-dim) 60%, transparent)}
.rank-it{
  margin-top:8px;display:inline-flex;align-items:center;gap:6px;border:none;border-radius:999px;
  padding:5px 11px;font-size:11.5px;font-weight:700;color:var(--accent-ink);
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 6px 14px -8px color-mix(in oklab, var(--accent) 80%, transparent);
  transition:transform .3s var(--spring);
}
.rank-it:hover{transform:translateY(-1px) scale(1.03)}
.rank-it svg{width:12px;height:12px}

/* rank-change badge */
.delta{
  display:inline-flex;align-items:center;margin-left:10px;vertical-align:3px;
  font-family:var(--font-body);font-size:11px;font-weight:750;letter-spacing:.02em;
  padding:3px 9px;border-radius:999px;white-space:nowrap;
  animation:deltaFade 3s var(--ease) forwards;
}
.delta.up{background:color-mix(in oklab, var(--up) 20%, transparent);color:var(--up)}
.delta.down{background:color-mix(in oklab, var(--down) 18%, transparent);color:var(--down)}
.delta.new{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink)}
.rank-row.look-scene .delta.up,.rank-row.look-bold .delta.up{background:var(--up);color:#04210F}
.rank-row.look-scene .delta.down,.rank-row.look-bold .delta.down{background:var(--down);color:#fff}
@keyframes deltaFade{0%{opacity:0;transform:translateY(5px) scale(.9)}10%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0}}

.rank-list.finding .rank-row:not(.find-hit){opacity:.2;filter:saturate(.4)}
.rank-list.finding .rank-row.find-hit{box-shadow:0 0 0 2px var(--accent), var(--shadow-2)}

/* first paint: rows float up in sequence */
.rank-list.intro .rank-row{animation:rise .7s var(--spring) backwards;animation-delay:calc(var(--i, 0) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}}

.milestone{
  list-style:none;display:flex;align-items:center;gap:14px;margin:8px 4px;
  font-family:var(--font-display);font-variation-settings:var(--soft);font-style:italic;font-weight:500;font-size:16px;
  color:var(--ink-dim);user-select:none;
}
.milestone::before,.milestone::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,color-mix(in oklab, var(--ink) 18%, transparent))}
.milestone::after{background:linear-gradient(90deg,color-mix(in oklab, var(--ink) 18%, transparent),transparent)}

/* per-row style strip / action strip */
.row-style,.row-actions{
  grid-column:1 / -1;display:flex;gap:14px;flex-wrap:wrap;align-items:center;
  padding:12px 14px 4px;margin-top:6px;border-top:1px solid color-mix(in oklab, currentColor 14%, transparent);
}
.row-style .grp{display:flex;align-items:center;gap:8px}
.row-style .lbl{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
.rank-row.look-scene .seg,.rank-row.look-bold .seg{background:rgba(0,0,0,.25)}
.cdots{display:flex;gap:7px;align-items:center}
.cdot{width:22px;height:22px;border-radius:50%;padding:0;border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 6px rgb(0 0 0 / .25);transition:transform .3s var(--spring)}
.cdot:hover{transform:scale(1.2)}
.cdot.active{box-shadow:0 0 0 2px currentColor, 0 2px 6px rgb(0 0 0 / .25)}
.row-actions{gap:8px;padding:12px 12px 4px}
.row-actions .btn{padding:8px 13px;font-size:12.5px;color:inherit;background:color-mix(in oklab, currentColor 8%, transparent);box-shadow:none}
.row-actions .btn svg{width:14px;height:14px}
.row-actions .act-danger{color:var(--down)}
.rank-row.look-scene .row-actions .act-danger,.rank-row.look-bold .row-actions .act-danger{color:#FF9A9C}

/* sorting: press-and-hold lifts a row in place; the rest glide on transforms */
.rank-row.pressing{transform:scale(.975);transition:transform .3s var(--ease), box-shadow .3s}
.rank-list.sorting > *{transition:transform .34s cubic-bezier(.2,.9,.25,1), opacity .25s}
.rank-list.sorting > .milestone{opacity:0}
.rank-list.sorting > .rank-row.lifted{
  z-index:40;transition:box-shadow .25s var(--ease);cursor:grabbing;
  box-shadow:0 34px 70px -22px rgb(0 0 0 / .5), 0 0 0 2px color-mix(in oklab, var(--accent) 55%, transparent);
}
.rank-list.sorting > .rank-row.lifted.dropping{transition:transform .3s cubic-bezier(.2,1.05,.3,1), box-shadow .3s}
body.drag-active{cursor:grabbing;-webkit-user-select:none;user-select:none}
body.drag-active .add-wrap,body.drag-active .list-toolbar{opacity:.15;pointer-events:none}

/* inline edit */
.row-edit{display:grid;gap:8px;padding:2px 8px 2px 0}
.row-edit input{-webkit-user-select:text;user-select:text;
  width:100%;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);color:var(--ink);padding:10px 12px;font-size:15px;
}
.row-edit input:focus{outline:none;box-shadow:0 0 0 3px color-mix(in oklab, var(--accent) 35%, transparent)}
.row-edit .edit-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ============================================================
   Discover — "Have you seen…?" swipe deck
   ============================================================ */
.discover{margin:46px 0 6px;position:relative}
.disc-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.disc-head h3{font-family:var(--font-display);font-variation-settings:var(--soft);font-weight:540;font-size:32px;letter-spacing:-.025em;margin:0;line-height:1}
.disc-head h3 em{font-style:italic;background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
.disc-count{font-size:12px;font-weight:700;color:var(--ink-dim);padding:5px 11px;border-radius:999px;background:color-mix(in oklab, var(--ink) 6%, transparent)}
.disc-count:empty{display:none}
.disc-tog{margin-left:auto}
.discover.collapsed .disc-body{display:none}
.disc-sub{color:var(--ink-dim);font-size:14px;line-height:1.5;margin:8px 0 18px;max-width:62ch}
.deck{position:relative;height:296px;max-width:640px;margin:0 auto}
.deck-card{
  position:absolute;left:0;right:0;top:0;height:268px;display:flex;gap:22px;align-items:center;
  padding:16px 22px 16px 16px;border-radius:30px;overflow:hidden;
  background:var(--surface);box-shadow:var(--shadow-2);
  touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab;
  transform-origin:50% 100%;
  transition:transform .5s cubic-bezier(.2,1.05,.3,1), opacity .4s ease;
}
.deck-card[data-depth="1"]{transform:translate3d(0,14px,0) scale(.95);opacity:.75;pointer-events:none}
.deck-card[data-depth="2"]{transform:translate3d(0,28px,0) scale(.9);opacity:.4;pointer-events:none}
.deck .deck-card.enter{transform:translate3d(0,46px,0) scale(.85);opacity:0}
.deck-card.grabbing{transition:none;cursor:grabbing}
.deck-card.leaving{transition:transform .42s cubic-bezier(.35,.6,.4,1), opacity .42s ease;pointer-events:none}
.deck-art{flex:0 0 auto;height:100%;aspect-ratio:2/3;border-radius:20px;overflow:hidden;
  background:linear-gradient(160deg,var(--surface-2),color-mix(in oklab, var(--accent) 18%, var(--surface-2)));box-shadow:0 18px 34px -16px rgb(0 0 0 / .5)}
.deck-art img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.deck-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:8px}
.deck-why{align-self:flex-start;font-size:12px;font-weight:700;line-height:1.35;padding:6px 12px;border-radius:14px;
  color:var(--accent);background:color-mix(in oklab, var(--accent) 14%, transparent)}
.deck-name{font-family:var(--font-display);font-variation-settings:var(--soft);font-weight:580;font-size:34px;line-height:1.02;letter-spacing:-.03em}
.deck-meta{color:var(--ink-dim);font-size:14px}
.deck-more{color:var(--ink-dim);font-size:12.5px;line-height:1.4}
.stamp{position:absolute;top:20px;right:20px;padding:6px 14px;border-radius:12px;font-weight:850;font-size:17px;letter-spacing:.1em;text-transform:uppercase;
  border:3px solid currentColor;background:color-mix(in oklab, var(--surface) 80%, transparent);pointer-events:none}
.stamp.yes{color:var(--up);opacity:var(--yes,0);transform:rotate(10deg)}
.stamp.no{color:var(--down);opacity:var(--no,0);transform:rotate(-10deg)}
.deck-empty{position:absolute;left:0;right:0;top:0;height:268px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
  border-radius:30px;color:var(--ink-dim);font-size:15px;background:color-mix(in oklab, var(--surface) 60%, transparent)}
.deck.loading .deck-empty{
  background:linear-gradient(100deg, color-mix(in oklab, var(--surface) 55%, transparent) 30%, var(--surface) 50%, color-mix(in oklab, var(--surface) 55%, transparent) 70%);
  background-size:300% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
.deck-actions{display:flex;justify-content:center;align-items:center;gap:12px;margin:4px 0 6px}
.deck-btn{display:inline-flex;align-items:center;gap:9px;border:none;border-radius:999px;padding:0 24px;min-height:54px;
  font-size:15px;font-weight:700;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1);
  transition:transform .3s var(--spring), opacity .2s}
.deck-btn svg{width:19px;height:19px}
.deck-btn:active{transform:scale(.93)}
.deck-btn:disabled{opacity:.35}
.deck-btn.no svg{color:var(--down)}
.deck-btn.yes{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:0 14px 28px -14px color-mix(in oklab, var(--accent) 85%, transparent)}
.deck-btn.skip{background:transparent;box-shadow:none;color:var(--ink-dim);padding:0 14px}

/* row action sheet */
.modal.sheet{width:min(460px,100%);padding:22px}
.sheet-head{display:flex;gap:14px;align-items:center;margin:0 4px 16px}
.sheet-head img{width:52px;height:74px;object-fit:cover;border-radius:12px;box-shadow:var(--shadow-1);flex:none}
.sheet-title{font-family:var(--font-display);font-variation-settings:var(--soft);font-weight:580;font-size:25px;letter-spacing:-.02em;line-height:1.08;margin-top:3px}
.sheet-note{color:var(--ink-dim);font-size:13px;margin-top:3px}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet-btn{display:flex;align-items:center;gap:12px;border:none;border-radius:18px;padding:12px;min-height:62px;text-align:left;
  background:color-mix(in oklab, var(--ink) 5%, transparent);color:var(--ink);transition:background .2s, transform .3s var(--spring)}
.sheet-btn:hover{background:color-mix(in oklab, var(--ink) 9%, transparent)}
.sheet-btn:active{transform:scale(.96)}
.sheet-btn .si{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--surface);color:var(--accent);box-shadow:var(--shadow-1)}
.sheet-btn .si svg{width:17px;height:17px}
.sheet-btn .st{display:flex;flex-direction:column;min-width:0}
.sheet-btn .st b{font-size:14px;font-weight:700}
.sheet-btn .st small{font-size:11.5px;color:var(--ink-dim);margin-top:2px;line-height:1.3}
.sheet-btn.wide{grid-column:1 / -1}
.sheet-btn.danger .si,.sheet-btn.danger b{color:var(--down)}

/* options menu */
.opt-wrap{position:relative}
.opt-btn svg{width:15px;height:15px}
.opt-menu{position:absolute;right:0;top:calc(100% + 10px);z-index:60;min-width:250px;padding:6px;border-radius:20px;
  background:var(--surface);box-shadow:var(--shadow-2), 0 0 0 1px var(--line);animation:panel .28s var(--spring)}
.opt-item{display:flex;align-items:center;gap:12px;width:100%;border:none;background:transparent;color:var(--ink);
  padding:12px;border-radius:14px;font-size:14.5px;font-weight:600;text-align:left;min-height:48px}
.opt-item:hover{background:color-mix(in oklab, var(--ink) 6%, transparent)}
.opt-item .oi{display:inline-flex;color:var(--ink-dim)}
.opt-item .oi svg{width:17px;height:17px}
.tgl{margin-left:auto;width:38px;height:23px;border-radius:999px;flex:none;position:relative;background:color-mix(in oklab, var(--ink) 16%, transparent);transition:background .25s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .3);transition:transform .3s var(--spring)}
.tgl.on{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.tgl.on::after{transform:translateX(15px)}

/* ============================================================
   Add bar (sticky glass) + suggestions
   ============================================================ */
.add-wrap{position:sticky;bottom:max(16px, env(safe-area-inset-bottom));z-index:30;margin-top:26px;transition:opacity .25s var(--ease)}
.add-bar{
  display:grid;grid-template-columns:1fr auto;gap:8px 10px;
  background:var(--glass);
  border:none;border-radius:26px;padding:10px 10px 10px 12px;
  box-shadow:0 24px 50px -22px rgb(var(--sh) / .55), var(--shadow-1);
  transition:box-shadow .3s var(--ease);
}
.add-bar:focus-within{box-shadow:0 0 0 3px color-mix(in oklab, var(--accent) 30%, transparent), 0 24px 50px -22px rgb(var(--sh) / .55)}
.add-fields{display:grid;gap:2px;min-width:0}
.add-bar input{border:none;background:transparent;color:var(--ink);font-size:16.5px;padding:9px 10px;border-radius:14px;width:100%;min-width:0}
.add-bar input:focus{outline:none;background:color-mix(in oklab, var(--surface) 70%, transparent)}
.add-bar input.add-note-input{font-size:14px;color:var(--ink-dim);padding:6px 10px}
.add-bar:not(:focus-within) .add-note-input:placeholder-shown{display:none}
.add-bar > .btn{align-self:start;padding:11px 20px;font-size:14px}
.add-foot{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:0 4px 2px}
.add-mode{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:650;color:var(--ink-dim)}
.add-hint{font-size:11.5px;color:var(--ink-dim)}
.add-hint kbd{font-family:var(--font-mono);font-size:10px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;margin:0 1px;color:var(--ink);background:var(--surface)}

.sugg-panel{
  position:absolute;left:0;right:0;bottom:calc(100% + 10px);z-index:40;
  background:var(--surface);
  border:none;border-radius:24px;padding:6px;
  box-shadow:0 -20px 50px -20px rgb(var(--sh) / .5), var(--shadow-2);
  max-height:min(420px, 56vh);overflow-y:auto;animation:panel .28s var(--spring);
}
@keyframes panel{from{opacity:0;transform:translateY(8px) scale(.985)}}
.sugg{
  display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;
  width:100%;text-align:left;padding:8px 10px;border:none;background:transparent;color:var(--ink);border-radius:16px;
  transition:background .15s;
}
.sugg:hover,.sugg.sel{background:color-mix(in oklab, var(--accent) 10%, transparent)}
.sugg .s-art{width:44px;height:62px;border-radius:9px;overflow:hidden;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink-dim);box-shadow:0 6px 14px -8px rgb(var(--sh) / .6)}
.sugg .s-art img{width:100%;height:100%;object-fit:cover;display:block}
.sugg .s-art svg{width:18px;height:18px;opacity:.6}
.sugg .s-name{font-weight:650;font-size:14.5px;line-height:1.25}
.sugg .s-sub{color:var(--ink-dim);font-size:12px;margin-top:2px;line-height:1.35}
.sugg .s-src{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);border:1px solid var(--line);border-radius:999px;padding:3px 8px;white-space:nowrap}
.sugg .s-src.s-have{color:var(--accent);border-color:color-mix(in oklab, var(--accent) 50%, transparent)}
.sugg-status{padding:10px 12px;font-size:12.5px;color:var(--ink-dim);display:flex;align-items:center;gap:8px}
.sugg-status .spin{width:12px;height:12px;border-radius:50%;border:2px solid color-mix(in oklab, var(--accent) 30%, transparent);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.empty-state{
  text-align:center;padding:64px 20px;border:none;
  border-radius:var(--r-xl);color:var(--ink-dim);list-style:none;background:color-mix(in oklab, var(--surface) 60%, transparent);
}
.empty-state .big{font-family:var(--font-display);font-variation-settings:var(--soft);font-style:italic;font-weight:500;font-size:38px;color:var(--ink);letter-spacing:-.02em;margin-bottom:8px}

/* ============================================================
   Modal
   ============================================================ */
.modal-veil{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
  background:color-mix(in oklab, var(--bg) 40%, rgba(0,0,0,.45));
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  animation:veil .25s var(--ease);
}
@keyframes veil{from{opacity:0}}
.modal{
  width:min(640px,100%);max-height:90vh;overflow:auto;
  background:color-mix(in oklab, var(--surface) 94%, transparent);color:var(--ink);
  border:none;border-radius:32px;padding:30px;
  box-shadow:0 40px 100px -30px rgb(0 0 0 / .55);
  animation:pop .45s var(--spring);
}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}}
.modal h2{font-family:var(--font-display);font-variation-settings:var(--soft);font-weight:560;font-size:36px;letter-spacing:-.03em;margin:4px 0 6px;line-height:1.02}
.modal .hint{color:var(--ink-dim);font-size:14px;margin:0 0 18px;line-height:1.55}
.field-lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);display:block;margin:20px 0 8px}
.modal input[type="text"],.modal input[type="password"]{
  width:100%;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:12px 14px;font-size:16px;
  box-shadow:inset 0 1px 2px rgb(var(--sh) / .06);
}
.modal input[type="text"]:focus,.modal input[type="password"]:focus{outline:none;box-shadow:0 0 0 3px color-mix(in oklab, var(--accent) 32%, transparent)}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.tpl{
  border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);
  padding:12px 13px;text-align:left;font-size:13.5px;font-weight:650;
  transition:border-color var(--speed), box-shadow var(--speed), transform .3s var(--spring);
}
.tpl small{display:block;font-weight:500;color:var(--ink-dim);font-size:11.5px;margin-top:3px}
.tpl:hover{transform:translateY(-2px)}
.tpl.active{border-color:transparent;box-shadow:0 0 0 2px var(--accent), 0 10px 22px -12px color-mix(in oklab, var(--accent) 70%, transparent)}
.modal-actions{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:26px;flex-wrap:wrap}
.auth-err{color:var(--down);font-size:13px;font-weight:650;margin-top:12px;min-height:1.2em}

/* head-to-head */
.modal.duel{width:min(800px,100%)}
.duel-meter{height:5px;border-radius:5px;background:color-mix(in oklab, var(--ink) 7%, transparent);overflow:hidden;margin:6px 0 0}
.duel-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:5px;transition:width .5s var(--spring)}
.duel-stage{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch;margin-top:22px}
.duel-card{
  position:relative;border:none;border-radius:26px;overflow:hidden;
  background:linear-gradient(170deg, color-mix(in oklab, var(--c1) 22%, var(--surface)), var(--surface) 70%);
  color:var(--ink);padding:0;text-align:left;display:flex;flex-direction:column;
  box-shadow:var(--shadow-1), 0 30px 60px -32px color-mix(in oklab, var(--c1) 85%, transparent);
  transition:transform .45s var(--spring), box-shadow .3s, opacity .3s, filter .3s;
}
.duel-card:hover{transform:translateY(-6px) rotate(-.5deg)}
.duel-card + .duel-vs + .duel-card:hover{transform:translateY(-6px) rotate(.5deg)}
.duel-card.win{transform:scale(1.04);box-shadow:0 0 0 3px var(--accent), 0 36px 70px -30px color-mix(in oklab, var(--c1) 90%, transparent)}
.duel-card.lose{opacity:.28;transform:scale(.94);filter:saturate(.3)}
.duel-art{width:100%;aspect-ratio:2/3;max-height:350px;background:linear-gradient(160deg,var(--c1),var(--c2));display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-variation-settings:var(--soft);font-size:96px;font-weight:600;color:rgba(255,255,255,.9)}
.duel-art img{width:100%;height:100%;object-fit:cover;display:block}
.duel-info{padding:14px 16px 17px}
.duel-tag{font-size:10.5px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.duel-name{font-family:var(--font-display);font-variation-settings:var(--soft);font-weight:580;font-size:22px;letter-spacing:-.02em;line-height:1.1;margin-top:5px}
.duel-note{color:var(--ink-dim);font-size:12.5px;margin-top:5px;line-height:1.4}
.duel-vs{align-self:center;font-family:var(--font-display);font-variation-settings:var(--soft);font-style:italic;font-weight:500;font-size:34px;color:var(--ink-dim)}
.duel-keys{margin-right:auto;font-size:12px;color:var(--ink-dim)}

/* artwork picker */
.modal.picker{width:min(860px,100%)}
.pick-sec{margin-top:18px}
.pick-sec h5{margin:0 0 10px;font-size:11px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:12px}
.pick-grid.wide{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.pick{
  border:none;border-radius:18px;overflow:hidden;background:var(--surface);
  padding:0;text-align:left;color:var(--ink);display:flex;flex-direction:column;
  transition:transform .4s var(--spring), box-shadow .3s;box-shadow:var(--shadow-1);
}
.pick:hover{transform:translateY(-3px);box-shadow:var(--shadow-2)}
.pick:disabled{opacity:.5;transform:none;cursor:default}
.pick.current{box-shadow:0 0 0 2.5px var(--accent), var(--shadow-1)}
.p-art{aspect-ratio:2/3;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink-dim)}
.pick-grid.wide .p-art{aspect-ratio:16/9}
.p-art img{width:100%;height:100%;object-fit:cover;display:block}
.p-art svg{width:22px;height:22px;opacity:.5}
.p-info{padding:9px 10px 11px}
.p-name{font-weight:650;font-size:13px;line-height:1.25}
.p-sub{color:var(--ink-dim);font-size:11px;margin-top:3px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-src{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);margin-top:6px}
.p-tag{position:absolute;top:8px;left:8px;font-size:9.5px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink)}
.pick .p-art{position:relative}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px) scale(.96);
  background:var(--ink);color:var(--bg);
  padding:11px 12px 11px 20px;border-radius:999px;font-size:13.5px;font-weight:650;z-index:200;opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:14px;max-width:calc(100vw - 28px);
  box-shadow:0 20px 40px -14px rgb(0 0 0 / .45);
  transition:opacity .3s var(--ease), transform .45s var(--spring);
}
.toast:not(.has-act){padding-right:20px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.toast.show.has-act{pointer-events:auto}
.toast-act{border:none;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:800;background:color-mix(in oklab, var(--bg) 22%, transparent);color:inherit;white-space:nowrap}
.toast-act:hover{background:color-mix(in oklab, var(--bg) 34%, transparent)}

.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);text-decoration:none;font-size:13.5px;font-weight:650;margin-bottom:6px;border-radius:8px;padding:2px 4px}
.backlink:hover{color:var(--ink)}
.backlink svg{width:14px;height:14px}

/* density: compact */
.rank-list.compact{gap:7px}
.compact .rank-row{min-height:60px;padding:6px 10px 6px 0;grid-template-columns:58px 1fr auto;border-radius:16px}
.compact .rank-row.has-art{grid-template-columns:58px 40px 1fr auto}
.compact .row-art{width:40px;height:56px;border-radius:9px}
.compact .rank-num{font-size:30px}
.compact .row-title{font-size:15px}
.compact .row-note{font-size:12px;margin-top:1px}
.compact .rank-row.is-top,.compact .rank-row.is-podium{min-height:80px;border-radius:20px;padding:8px 10px 8px 0}
.compact .rank-row.is-top,.compact .rank-row.is-podium{grid-template-columns:70px 1fr auto}
.compact .rank-row.is-top.has-art,.compact .rank-row.is-podium.has-art{grid-template-columns:70px 50px 1fr auto}
.compact .rank-row.is-top .rank-num{font-size:50px}
.compact .rank-row.is-podium .rank-num{font-size:38px}
.compact .rank-row.is-top .row-art,.compact .rank-row.is-podium .row-art{width:50px;height:70px;border-radius:11px}
.compact .rank-row.is-top .row-title{font-size:22px}
.compact .rank-row.is-podium .row-title{font-size:16.5px}
.compact .crown{display:none}
.compact .rank-it{margin-top:4px}

/* ============================================================
   v6 — immersion layer
   ============================================================ */
/* no double-tap-zoom delay or swallowed taps on any control */
button,.rank-num,.deck-card,.q-pick{touch-action:manipulation}

/* color bloom: when artwork lands or an entry gets ranked, its colors flood out from the poster */
.bloom{
  position:absolute;z-index:0;pointer-events:none;left:110px;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;
  background:radial-gradient(circle, color-mix(in oklab, var(--p1) 75%, transparent) 0%, color-mix(in oklab, var(--p2) 40%, transparent) 38%, transparent 68%);
  animation:bloom 1.5s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes bloom{from{transform:scale(.08);opacity:.95}to{transform:scale(2.4);opacity:0}}
.rank-row.flash{animation:flash 1.4s var(--ease)}
@keyframes flash{0%,45%{box-shadow:0 0 0 3px color-mix(in oklab, var(--p1) 70%, var(--accent)), 0 24px 60px -20px color-mix(in oklab, var(--p1) 80%, transparent)}100%{box-shadow:var(--shadow-1)}}

/* unranked entries wait in muted color; ranking them brings the color in */
.rank-row.unranked{--glow-amt:26%}
.rank-row.unranked .row-art img{filter:saturate(.55)}

/* home cards glow with their #1 */
.list-card{background:radial-gradient(90% 70% at 100% 0%, color-mix(in oklab, var(--lc, transparent) 24%, transparent), transparent 70%), var(--surface)}

/* ⋯ sheet takes the entry's colors */
.modal.sheet{background:radial-gradient(110% 55% at 0% 0%, color-mix(in oklab, var(--c1, transparent) 32%, transparent), transparent 62%), var(--surface)}

/* head-to-head: the room lights up in both contenders' colors */
@property --v1 { syntax: '<color>'; inherits: false; initial-value: transparent; }
@property --v2 { syntax: '<color>'; inherits: false; initial-value: transparent; }
.modal-veil.duel-veil{
  background:
    radial-gradient(60% 85% at 16% 50%, color-mix(in oklab, var(--v1) 62%, transparent), transparent 72%),
    radial-gradient(60% 85% at 84% 50%, color-mix(in oklab, var(--v2) 62%, transparent), transparent 72%),
    color-mix(in oklab, var(--bg) 45%, rgba(0,0,0,.5));
  transition:--v1 .6s var(--ease), --v2 .6s var(--ease);
}

/* swipe deck: each card glows in its own poster's colors, and so does the space behind it */
@property --dc1 { syntax: '<color>'; inherits: false; initial-value: transparent; }
@property --dc2 { syntax: '<color>'; inherits: false; initial-value: transparent; }
.deck{transition:--dc1 .9s var(--ease), --dc2 .9s var(--ease)}
.deck::before{
  content:"";position:absolute;inset:-30px 0 -10px;z-index:0;pointer-events:none;
  background:radial-gradient(50% 70% at 30% 50%, color-mix(in oklab, var(--dc1) 55%, transparent), transparent 70%),
             radial-gradient(45% 60% at 75% 45%, color-mix(in oklab, var(--dc2) 34%, transparent), transparent 70%);
}
.deck-card.lit{
  background:
    radial-gradient(70% 150% at 0% 50%, color-mix(in oklab, var(--c1) var(--glow-amt), var(--glow-base)), transparent 70%),
    radial-gradient(60% 130% at 100% 0%, color-mix(in oklab, var(--c2) var(--glow-amt), var(--glow-base)), transparent 72%),
    color-mix(in oklab, var(--c1) 12%, var(--surface));
}
.deck-card.lit .deck-art{box-shadow:0 22px 40px -16px color-mix(in oklab, var(--c1) 85%, #000)}
.deck-card.lit .deck-why{color:var(--ink);background:color-mix(in oklab, var(--c1) 30%, transparent)}
.disc-flash{font-size:12.5px;font-weight:700;color:var(--up);display:inline-flex;align-items:center;gap:6px;
  animation:dflash 2.4s var(--ease) forwards}
.disc-flash svg{width:14px;height:14px}
@keyframes dflash{0%{opacity:0;transform:translateY(4px)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}

/* compact notices at the top — never on top of anything you're tapping */
.toast{
  top:calc(14px + env(safe-area-inset-top));bottom:auto;
  transform:translateX(-50%) translateY(-12px) scale(.96);
  padding:8px 10px 8px 16px;font-size:12.5px;gap:10px;
}
.toast:not(.has-act){padding-right:16px}
.toast.show.has-act{pointer-events:none}
.toast-act{pointer-events:auto;padding:5px 11px;font-size:12px}

/* ============================================================
   Quick matchup — a surprise head-to-head that re-sorts the list
   ============================================================ */
@property --qa { syntax: '<color>'; inherits: true; initial-value: transparent; }
@property --qb { syntax: '<color>'; inherits: true; initial-value: transparent; }
.quick{
  position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));z-index:70;
  width:min(580px, calc(100vw - 24px));padding:14px 14px 12px;border-radius:28px;
  transform:translate(-50%, 30px) scale(.96);opacity:0;pointer-events:none;
  background:
    radial-gradient(70% 150% at 0% 55%, color-mix(in oklab, var(--qa) var(--glow-amt), var(--glow-base)), transparent 66%),
    radial-gradient(70% 150% at 100% 55%, color-mix(in oklab, var(--qb) var(--glow-amt), var(--glow-base)), transparent 66%),
    var(--surface);
  box-shadow:0 30px 70px -24px rgb(0 0 0 / .55), 0 0 0 1px var(--line);
  transition:transform .5s var(--spring), opacity .3s var(--ease), --qa .6s var(--ease), --qb .6s var(--ease);
}
.quick.open{transform:translate(-50%,0) scale(1);opacity:1;pointer-events:auto}
.q-head{display:flex;align-items:center;gap:10px;margin:0 4px 10px}
.q-kicker{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.q-kicker svg{width:11px;height:11px}
.q-sub{font-size:13px;font-weight:600;color:var(--ink-dim)}
.q-x{margin-left:auto;width:36px;height:36px;border-radius:12px;border:none;background:color-mix(in oklab, var(--ink) 7%, transparent);color:var(--ink-dim);
  display:inline-flex;align-items:center;justify-content:center}
.q-x svg{width:14px;height:14px}
.q-stage{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.q-vs{align-self:center;font-family:var(--font-display);font-variation-settings:var(--soft);font-style:italic;font-size:22px;color:var(--ink-dim)}
.q-pick{
  display:flex;align-items:center;gap:12px;padding:8px;border:none;border-radius:20px;text-align:left;min-height:96px;
  background:color-mix(in oklab, var(--surface) 70%, transparent);color:var(--ink);
  box-shadow:0 10px 24px -14px rgb(0 0 0 / .45);
  transition:transform .35s var(--spring), box-shadow .3s, opacity .3s;
}
.q-pick:active{transform:scale(.96)}
.q-pick .q-art{flex:none;width:58px;height:84px;border-radius:12px;overflow:hidden;
  background:linear-gradient(160deg, var(--c1, var(--surface-2)), color-mix(in oklab, var(--c1, var(--surface-2)) 50%, #000));
  display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-weight:800;font-size:26px;color:rgba(255,255,255,.85);
  box-shadow:0 12px 22px -10px color-mix(in oklab, var(--c1, #000) 80%, #000)}
.q-pick .q-art img{width:100%;height:100%;object-fit:cover;display:block}
.q-pick .q-txt{min-width:0}
.q-pick .q-rank{font-family:var(--font-num);font-weight:800;font-size:12px;letter-spacing:-.01em;color:var(--ink-dim)}
.q-pick .q-name{font-weight:700;font-size:15px;line-height:1.2;margin-top:2px;overflow-wrap:anywhere}
.q-pick.win{transform:scale(1.04);box-shadow:0 0 0 3px color-mix(in oklab, var(--c1, var(--accent)) 75%, var(--accent)), 0 20px 40px -16px color-mix(in oklab, var(--c1, var(--accent)) 80%, transparent)}
.q-pick.lose{opacity:.3;transform:scale(.95)}
.q-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 4px 0}
.q-skip{border:none;background:transparent;color:var(--ink-dim);font-size:12.5px;font-weight:650;padding:8px 4px;min-height:36px}
.q-prog{font-size:12px;font-weight:650;color:var(--ink-dim)}
.q-result{grid-column:1 / -1;text-align:center;font-weight:700;font-size:14px;padding:22px 8px}

@media (max-width:620px){
  .quick{bottom:calc(122px + env(safe-area-inset-bottom));padding:12px 10px 10px;border-radius:24px}
  .q-pick{flex-direction:column;align-items:flex-start;gap:8px;min-height:0}
  .q-pick .q-art{width:100%;height:auto;aspect-ratio:16/10}
  .q-sub{display:none}
}

/* ============================================================
   v7 — accounts
   ============================================================ */
.modal.auth{width:min(460px,100%);padding:30px 28px 24px;
  background:radial-gradient(120% 60% at 50% 0%, color-mix(in oklab, var(--accent) 16%, transparent), transparent 60%), var(--surface)}
.auth-badge{display:flex;justify-content:center;margin-bottom:10px}
.auth-badge .mark{width:52px;height:52px;border-radius:17px;display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--font-num);font-weight:800;font-size:28px;color:var(--accent-ink);
  background:linear-gradient(140deg,var(--accent),var(--accent-2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 16px 30px -12px color-mix(in oklab, var(--accent) 85%, transparent)}
.modal.auth h2{text-align:center}
.modal.auth .hint{text-align:center;margin-bottom:16px}
.auth-tabs{display:flex;width:100%;margin:0 0 16px}
.auth-tabs .seg-btn{flex:1;justify-content:center;padding:10px 8px;font-size:13.5px}
.auth-magic{display:flex;align-items:center;gap:12px;width:100%;border:none;border-radius:18px;padding:13px 16px;margin-bottom:4px;text-align:left;
  color:var(--ink);background:color-mix(in oklab, var(--accent) 12%, transparent);
  transition:transform .3s var(--spring), background .2s}
.auth-magic:hover{background:color-mix(in oklab, var(--accent) 18%, transparent)}
.auth-magic:active{transform:scale(.98)}
.auth-magic svg{width:20px;height:20px;color:var(--accent);flex:none}
.auth-magic span{display:flex;flex-direction:column}
.auth-magic b{font-size:14.5px}
.auth-magic small{font-size:12px;color:var(--ink-dim);margin-top:2px}
.auth-magic[hidden]{display:none}
.auth-row{display:flex;gap:6px;align-items:center}
.auth-row input{flex:1;min-width:0}
.auth-gen{flex:none;width:46px!important;height:46px!important;border-radius:14px!important;background:color-mix(in oklab, var(--ink) 6%, transparent)}
.auth-gen[hidden]{display:none}
.auth-gen svg{width:18px;height:18px}
.modal.auth .field-lbl{margin-top:16px}
.auth-keep{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:10px 12px;border-radius:14px;
  font-size:12.5px;color:var(--ink-dim);background:color-mix(in oklab, var(--up) 10%, transparent)}
.auth-keep[hidden]{display:none}
.auth-keep .btn{padding:7px 12px;font-size:12.5px;flex:none}
.auth-go{width:100%;justify-content:center;margin-top:16px;min-height:52px;font-size:15.5px}
.auth-later{display:block;margin:12px auto 0;border:none;background:transparent;color:var(--ink-dim);font-size:13px;font-weight:600;padding:8px}
.auth-later:hover{color:var(--ink)}

.acct-btn{padding:5px 14px 5px 5px}
.avatar{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;
  font-family:var(--font-num);font-weight:800;font-size:13px;color:var(--accent-ink);
  background:linear-gradient(140deg,var(--accent),var(--accent-2))}
.avatar.big{width:40px;height:40px;font-size:17px}
.acct-head{display:flex;align-items:center;gap:12px;padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.acct-who{font-weight:700;font-size:15px;margin-top:2px}
