  if (opts && opts.bloom && item.c1) addBloom(fresh);
  else anim(fresh, [{ opacity: .4 }, { opacity: 1 }], { duration: 400, easing: "ease-out" });
  if (list.items.indexOf(item) < 3) setAmbient(list);
}

async function enrichAll(list, btn) {
  const bare = list.items.filter(it => !(it.img || it.bg) || !(it.palette && it.palette.length));
  if (!bare.length) { toast("Every entry is already dressed"); return; }
  if (enrichAll.running) { toast("Already looking — hang tight"); return; }
  enrichAll.running = true;
  const label = btn && btn.querySelector("span");
  if (btn) btn.disabled = true;
  let done = 0, found = 0;
  toast("Looking up artwork for " + plural(bare.length, "entry", "entries") + "…");
  for (const item of bare) {
    if (View.listId !== list.id) break;
    if (label) label.textContent = "Finding… " + (done + 1) + "/" + bare.length;
    try {
      const m = await Media.bestMatch(list.template, item.title, contextTerms(list), true);
      if (m && await applyMedia(list, item, m)) found++;
    } catch (e) { console.warn("enrich failed for", item.title, e); }
    done++;
    await sleep(300);
  }
  enrichAll.running = false;
  if (btn) btn.disabled = false;
  if (label) label.textContent = "Find artwork";
  toast(found ? "Artwork found for " + plural(found, "entry", "entries") : "No new artwork found — check spelling or your connection");
}

/* lazy backdrops */
const bgLoaded = new Set();
const bgIO = ("IntersectionObserver" in window)
  ? new IntersectionObserver(ents => {
      for (const e of ents) if (e.isIntersecting) { setBg(e.target); bgIO.unobserve(e.target); }
    }, { rootMargin: "700px 0px" })
  : null;
function setBg(node) {
  const u = node.dataset.src;
  if (!u) return;
  node.style.backgroundImage = 'url("' + u.replace(/"/g, "%22") + '")';
  bgLoaded.add(u);
  delete node.dataset.src;
}
function lazyBg(node, url) {
  node.dataset.src = url;
  if (!bgIO || bgLoaded.has(url)) setBg(node);
}
function observeBgs(root) {
  if (!bgIO) return;
  root.querySelectorAll(".row-bg[data-src]").forEach(n => bgIO.observe(n));
}
function loadAllBgs() {
  document.querySelectorAll(".row-bg[data-src]").forEach(n => { if (bgIO) bgIO.unobserve(n); setBg(n); });
  document.querySelectorAll(".rank-row").forEach(r => { r.style.contentVisibility = "visible"; });
}
window.addEventListener("beforeprint", loadAllBgs);

/* ============================================================
   ROWS
   ============================================================ */
const MILESTONES = [10, 25, 50, 100, 250, 500];
function buildMilestone(n) {
  const m = el("li", "milestone");
  m.dataset.at = n;
  m.setAttribute("aria-hidden", "true");
  m.textContent = "the top " + n;
  return m;
}
function buildUnrankedHead(list, ol) {
  const n = list.items.length - rankedCount(list);
  const h = el("li", "unranked-head");
  h.appendChild(el("h4", null, "Unranked"));
  h.appendChild(el("span", "u-sub", plural(n, "entry", "entries") + " seen, not placed yet"));
  if (rankedCount(list) >= 1 || n > 1) {
    const b = el("button", "btn");
    b.innerHTML = ICONS.bolt + "<span>" + (n > 1 ? "Rank them all" : "Rank it") + "</span>";
    b.addEventListener("click", () => rankAll(list));
    h.appendChild(b);
  }
  return h;
}
function rankAll(list) {
  const next = () => {
    const L = getList(list.id);
    const it = L && L.items.find(x => x.unranked);
    if (!it || View.listId !== list.id) return;
    if (!rankedCount(L)) { relocate(L, it.id, 0, false, document.getElementById("rankList")); return next(); }
    openDuel(L, it.id, { onFinish: next, chain: true });
  };
  next();
}
function placeMilestones(ol) {
  const kids = [...ol.children];
  const ranked = [];
  for (const k of kids) { if (k.classList.contains("unranked-head")) break; if (k.classList.contains("rank-row")) ranked.push(k); }
  ol.querySelectorAll(".milestone").forEach(m => {
    const r = ranked[+m.dataset.at - 1];
    if (r && r.nextElementSibling !== m) r.after(m);
  });
}
function updateCount(list) {
  const n = document.getElementById("listCount");
  if (!n) return;
  const rc = rankedCount(list), unr = list.items.length - rc;
  n.textContent = "The definitive ranking · " + rc + " ranked" + (unr ? " · " + unr + " unranked" : "");
}

function drawRows(list, ol, opts) {
  opts = opts || {};
  ol.innerHTML = "";
  ol.classList.toggle("compact", list.density === "compact");
  ol.classList.toggle("intro", !!opts.intro);
  if (opts.intro) setTimeout(() => ol.classList.remove("intro"), 1600);
  updateCount(list);
  setAmbient(list);
  if (list.items.length === 0) {
    ol.classList.remove("finding");
    const es = el("li", "empty-state");
    es.appendChild(el("div", "big", "No. 1 is waiting"));
    es.appendChild(el("div", null, "Start typing below — suggestions bring the artwork with them."));
    ol.appendChild(es);
    return;
  }
  const rc = rankedCount(list);
  const frag = document.createDocumentFragment();
  list.items.forEach((item, i) => {
    if (i === rc) frag.appendChild(buildUnrankedHead(list, ol));
    const row = buildRow(list, item, i, ol);
    row.style.setProperty("--i", Math.min(i, 14));
    frag.appendChild(row);
    if (i < rc && MILESTONES.includes(i + 1) && rc > i + 1) frag.appendChild(buildMilestone(i + 1));
  });
  ol.appendChild(frag);
  if (View.findQ) ol.classList.toggle("finding", list.items.some(it => itemMatches(it, View.findQ)));
  observeBgs(ol);
  watchBand(list, ol);
}

const normLook = l => l === "backdrop" ? "scene" : l;
function buildRow(list, item, index, ol) {
  const rc = rankedCount(list);
  const unr = !!item.unranked;
  const li = el("li", "rank-row");
  if (!unr && index === 0) li.classList.add("is-top");
  else if (!unr && index < 3) li.classList.add("is-podium");
  if (unr) li.classList.add("unranked");
  li.dataset.id = item.id;
  if (View.findQ && itemMatches(item, View.findQ)) li.classList.add("find-hit");

  const hasArt = !!(item.img || item.bg);
  const look = normLook(item.look) || (hasArt ? "glow" : (item.c1 ? "tint" : "plain"));
  const pal = (item.palette && item.palette.length) ? item.palette : [];
  if (item.c1) {
    li.style.setProperty("--p1", item.c1);
    li.style.setProperty("--p2", pal[1] || item.c2 || item.c1);
    li.style.setProperty("--p3", pal[2] || item.c2 || item.c1);
  }
  if (look === "scene" && hasArt) {
    li.classList.add("look-scene");
    if (!(pal.length && item.c1)) li.style.setProperty("--p1", "#0A0C10");
    const bg = el("div", "row-bg");
    lazyBg(bg, item.bg || item.imgHi || item.img);
    li.appendChild(bg);
    li.appendChild(el("div", "row-scrim"));
  } else if (look === "bold" && item.c1) {
    li.classList.add("look-bold");
    li.style.setProperty("--row-ink", relLuma(item.c1) > 160 ? "#15171C" : "#FFFFFF");
  } else if (look === "glow" && item.c1) {
    li.classList.add("look-glow");
  } else if (item.c1 && look !== "plain") {
    li.classList.add("look-tint");
  }

  const num = el("div", "rank-num", unr ? "–" : String(index + 1));
  num.tabIndex = 0;
  num.title = "Tap to type a rank";
  num.setAttribute("aria-label", (unr ? "Unranked" : "Rank " + (index + 1)) + ". Press Enter to type a rank");
  num.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target === num) { e.preventDefault(); openRankJump(list, item.id, ol); }
  });
  li.appendChild(num);

  if (item.img) {
    li.classList.add("has-art");
    const art = el("div", "row-art");
    const im = el("img");
    im.src = (!unr && index === 0 && item.imgHi) ? item.imgHi : item.img;
    im.alt = ""; im.loading = "lazy"; im.decoding = "async";
    im.addEventListener("error", () => { art.remove(); li.classList.remove("has-art"); }, { once: true });
    art.appendChild(im);
    li.appendChild(art);
  }

  const body = el("div", "row-body");
  if (!unr && index === 0 && rc > 1 && list.density !== "compact") body.appendChild(el("div", "crown", "The GOAT"));
  body.appendChild(el("div", "row-title", item.title));
  if (item.note) body.appendChild(el("div", "row-note", item.note));
  if (unr) {
    const ri = el("button", "rank-it");
    ri.innerHTML = ICONS.bolt + "<span>" + (rc ? "Rank it" : "Make it #1") + "</span>";
    ri.addEventListener("click", () => rc ? openDuel(list, item.id) : relocate(list, item.id, 0, false, ol));
    body.appendChild(ri);
  }
  li.appendChild(body);

  /* controls: a grip + ⋯ on hover with a mouse; on touch, just a big ⋯ */
  const zoneStart = unr ? rc : 0, zoneEnd = unr ? list.items.length - 1 : rc - 1;
  const ctl = el("div", "row-ctl");
  const grip = el("button", "iconbtn drag-handle");
  grip.innerHTML = ICONS.grip;
  grip.title = "Drag to reorder (arrow keys work too)";
  grip.setAttribute("aria-label", "Reorder " + item.title + " — arrow keys move it");
  grip.addEventListener("keydown", e => {
    const i = list.items.findIndex(x => x.id === item.id);
    if (e.key === "ArrowUp" && i > zoneStart) { e.preventDefault(); moveTo(list, i, i - 1, ol, { focus: ".drag-handle" }); }
    if (e.key === "ArrowDown" && i < zoneEnd) { e.preventDefault(); moveTo(list, i, i + 1, ol, { focus: ".drag-handle" }); }
  });
  const more = el("button", "iconbtn more-btn");
  more.innerHTML = ICONS.more;
  more.title = "Actions";
  more.setAttribute("aria-label", "Actions for " + item.title);
  more.addEventListener("click", () => openRowSheet(list, item.id, ol));
  ctl.append(grip, more);
  li.appendChild(ctl);
  attachSort(li, list, ol);
  li.addEventListener("contextmenu", e => {
    if (li.classList.contains("pressing") || li.classList.contains("lifted")) e.preventDefault();
  });
  return li;
}

/* ---- the ⋯ menu: every row action, labeled, thumb-sized ---- */
function openRowSheet(listRef, itemId, ol) {
  const list = getList(listRef.id);
  const item = list && list.items.find(x => x.id === itemId);
  if (!item) return;
  const idx = list.items.indexOf(item);
  const rc = rankedCount(list), unr = !!item.unranked;
  const zoneStart = unr ? rc : 0, zoneEnd = unr ? list.items.length - 1 : rc - 1;
  const m = makeModal("sheet");
  const md = m.modal;
  if (item.c1) md.style.setProperty("--c1", item.c1);
  const head = el("div", "sheet-head");
  if (item.img) { const im = el("img"); im.src = item.img; im.alt = ""; head.appendChild(im); }
  const ht = el("div");
  ht.append(el("div", "eyebrow", unr ? "Unranked" : "Ranked #" + (idx + 1)), el("div", "sheet-title", item.title));
  if (item.note) ht.appendChild(el("div", "sheet-note", item.note));
  head.appendChild(ht);
  md.appendChild(head);
  const grid = el("div", "sheet-actions");
  const act = (icon, label, sub, fn, cls) => {
    const b = el("button", "sheet-btn" + (cls ? " " + cls : ""));
    b.innerHTML = '<span class="si">' + icon + '</span><span class="st"><b>' + escapeHTML(label) + "</b>" +
      (sub ? "<small>" + escapeHTML(sub) + "</small>" : "") + "</span>";
    b.addEventListener("click", () => { m.onClose = () => { }; m.close(); fn(); });
    grid.appendChild(b);
  };
  if (unr) {
    act(ICONS.bolt, rc ? "Rank it" : "Make it #1", rc ? "Pick winners head-to-head" : "Start the ranking with it",
      () => rc ? openDuel(list, itemId) : relocate(list, itemId, 0, false, ol), "wide");
  } else if (rc > 1) {
    act(ICONS.bolt, "Re-rank by matchup", "Pick winners head-to-head", () => openDuel(list, itemId), "wide");
  }
  act(ICONS.hash, "Type a rank", unr ? "Drop it straight in" : "Jump anywhere", () => openRankJump(list, itemId, ol));
  if (!unr) act(ICONS.shelf, "Move to Unranked", "Seen it, not placed", () => relocate(list, itemId, list.items.length - 1, true, ol));
  if (idx > zoneStart) act(ICONS.up, "Move up", "One spot", () => moveTo(list, idx, idx - 1, ol));
  if (idx < zoneEnd) act(ICONS.down, "Move down", "One spot", () => moveTo(list, idx, idx + 1, ol));
  act(ICONS.spark, (item.img || item.bg) ? "Artwork" : "Find artwork", isTv(list) ? "Official posters" : "Swap or remove", () => openArtPicker(list, item));
  act(ICONS.paint, "Style", "Look & color", () => {
    const li = rowEl(ol, itemId);
    if (li && !li.querySelector(".row-style")) li.appendChild(buildStyleStrip(list, item, ol));
  });
  act(ICONS.edit, "Edit", "Title & note", () => { const li = rowEl(ol, itemId); if (li) enterEdit(list, item, li, ol); });
  act(ICONS.trash, "Delete", "Undo is one tap away", () => deleteItem(list, itemId, ol), "danger");
  md.appendChild(grid);
}

function deleteItem(list, id, ol) {
  const item = list.items.find(x => x.id === id);
  if (!item) return;
  History.push(list, "Removed “" + item.title + "”");
  list.items = list.items.filter(x => x.id !== id);
  persist(list);
  announce(item.title + " removed");
  const li = rowEl(ol, id);
  const done = () => drawRows(list, ol);
  if (li) anim(li, [{ opacity: 1 }, { opacity: 0, transform: "translateX(24px) scale(.97)" }], { duration: 240, easing: "ease-out" }).finished.then(done, done);
  else done();
  toast("Removed “" + item.title + "”", { action: { label: "Undo", fn: () => History.undo() } });
}

/* per-row style editor */
function rebuildRowKeepStrip(list, item, ol) {
  const idx = list.items.findIndex(x => x.id === item.id);
  const old = rowEl(ol, item.id);
  const fresh = buildRow(list, item, idx, ol);
  if (old) old.replaceWith(fresh);
  fresh.appendChild(buildStyleStrip(list, item, ol));
  observeBgs(fresh);
  if (idx < 3) setAmbient(list);
}
function buildStyleStrip(list, item, ol) {
  const strip = el("div", "row-style");
  const lookGrp = el("div", "grp");
  lookGrp.appendChild(el("span", "lbl", "Look"));
  const seg = el("div", "seg");
  const hasArt = !!(item.img || item.bg);
  const cur = normLook(item.look) || (hasArt ? "glow" : (item.c1 ? "tint" : "plain"));
  for (const [id, label] of [["plain", "Plain"], ["tint", "Subtle"], ["glow", "Glow"], ["scene", "Scene"], ["bold", "Bold"]]) {
    const b = el("button", "seg-btn" + (cur === id ? " active" : ""), label);
    b.type = "button";
    if (id === "scene" && !hasArt) { b.disabled = true; b.title = "Needs artwork — try the ✦ button"; }
    if ((id === "tint" || id === "bold" || id === "glow") && !item.c1) { b.disabled = true; b.title = "Needs colors — try the ✦ button"; }
    b.addEventListener("click", () => {
      if (normLook(item.look) === id) return;
      History.push(list, "Restyled “" + item.title + "”");
      item.look = id;
      persist(list);
      rebuildRowKeepStrip(list, item, ol);
    });
    seg.appendChild(b);
  }
  lookGrp.appendChild(seg);
  strip.appendChild(lookGrp);
  const opts = [...new Set([...(item.palette || []), item.c1].filter(Boolean))];
  if (opts.length) {
    const colGrp = el("div", "grp");
    colGrp.appendChild(el("span", "lbl", "Color"));
    const dots = el("div", "cdots");
    for (const c of opts.slice(0, 6)) {
      const d = el("button", "cdot" + (c === item.c1 ? " active" : ""));
      d.type = "button";
      d.style.background = c;
      d.title = "Lead with this color";
      d.setAttribute("aria-label", "Set row color " + c);
      d.addEventListener("click", () => {
        if (item.c1 === c && item.custom) return;
        History.push(list, "Recolored “" + item.title + "”");
        // move the chosen color to the front so Glow leads with it
        const rest = (item.palette || []).filter(x => x !== c);
        item.palette = item.palette && item.palette.length ? [c].concat(rest) : item.palette;
        item.c1 = c;
        item.c2 = rest[0] || darken(c, .35);
        item.custom = true;
        persist(list);
        rebuildRowKeepStrip(list, item, ol);
      });
      dots.appendChild(d);
    }
    colGrp.appendChild(dots);
    strip.appendChild(colGrp);
  }
  const done = el("button", "btn btn-ghost", "Done");
  done.style.marginLeft = "auto";
  done.addEventListener("click", () => strip.remove());
  strip.appendChild(done);
  return strip;
}

/* ============================================================
   MOVING
   ============================================================ */
/* Move an entry to index `toIdx` (index in the array after removing it),
   optionally changing whether it's ranked. Every move path ends here. */
function relocate(list, id, toIdx, makeUnranked, ol, opts) {
  opts = opts || {};
  const from = list.items.findIndex(x => x.id === id);
  if (from < 0 || !ol) return;
  const item = list.items[from];
  const was = !!item.unranked;
  const will = !!makeUnranked;
  if (from === toIdx && was === will) return;
  const label = was && !will ? "Ranked “" + item.title + "”" : !was && will ? "Unranked “" + item.title + "”" : "Moved “" + item.title + "”";
  if (!opts.noHistory) History.push(list, label);
  flip(ol, () => {
    list.items.splice(from, 1);
    if (will) item.unranked = true; else delete item.unranked;
    list.items.splice(Math.max(0, Math.min(toIdx, list.items.length)), 0, item);
    normalize(list);
    persist(list);
    drawRows(list, ol);
  });
  const to = list.items.indexOf(item);
  if (was && !will) { badge(ol, id, "new", "★ #" + (to + 1)); addBloom(rowEl(ol, id)); }
  else if (!was && will) badge(ol, id, "down", "unranked");
  else if (!will) badge(ol, id, to < from ? "up" : "down", (to < from ? "▲ " : "▼ ") + Math.abs(from - to));
  announce(item.title + (will ? " moved to Unranked" : " is now number " + (to + 1)));
  const row = rowEl(ol, id);
  if (row && opts.scroll) { if (row.scrollIntoView) row.scrollIntoView({ block: "center", behavior: "smooth" }); flashRow(row); }
  if (row && opts.focus) {
    const f = row.querySelector(opts.focus);
    if (f && !f.disabled) f.focus();
    else { const n = row.querySelector(".rank-num"); if (n) n.focus(); }
  }
  if (!opts.quietToast && !was && will) toast("Moved to Unranked", { action: { label: "Undo", fn: () => History.undo() } });
}
function moveTo(list, from, to, ol, opts) {
  if (to < 0 || to >= list.items.length || to === from || from < 0) return;
  const item = list.items[from];
  relocate(list, item.id, to, !!item.unranked, ol, opts);
}
function badge(ol, id, cls, text) {
  const row = rowEl(ol, id);
  const t = row && row.querySelector(".row-title");
  if (!t) return;
  const d = el("span", "delta " + cls, text);
  d.setAttribute("aria-hidden", "true");
  t.appendChild(d);
  setTimeout(() => d.remove(), 3100);
}
function flip(ol, mutate) {
  const before = new Map();
  for (const row of ol.children) if (row.dataset.id) before.set(row.dataset.id, row.getBoundingClientRect().top);
  mutate();
  for (const row of ol.children) {
    const prev = before.get(row.dataset.id);
    if (prev === undefined) continue;
    const dy = prev - row.getBoundingClientRect().top;
    if (dy) anim(row, [{ transform: "translateY(" + dy + "px)" }, { transform: "translateY(0)" }],
      { duration: 420, easing: "cubic-bezier(.2,1.1,.35,1)" });
  }
}

/* type-a-rank (works for unranked entries too — typing a number ranks them) */
function openRankJump(list, id, ol) {
  const li = rowEl(ol, id);
  if (!li) return;
  const num = li.querySelector(".rank-num");
  if (!num || num.querySelector("input")) return;
  const from = list.items.findIndex(x => x.id === id);
  if (from < 0) return;
  const item = list.items[from];
  const unr = !!item.unranked;
  const rc = rankedCount(list);
  const maxRank = unr ? rc + 1 : rc;
  const inp = el("input", "rank-jump");
  inp.type = "text"; inp.inputMode = "numeric"; inp.enterKeyHint = "go"; inp.maxLength = 5;
  inp.value = unr ? "" : String(from + 1);
  inp.placeholder = unr ? "#" : "";
  inp.setAttribute("aria-label", "Move to rank, 1 to " + maxRank);
  const prevText = num.textContent;
  num.textContent = "";
  num.appendChild(inp);
  inp.focus();
  inp.select();
  let done = false;
  const finish = commit => {
    if (done) return;
    done = true;
    const n = parseInt(inp.value, 10);
    if (!commit || isNaN(n)) { num.textContent = prevText; return; }
    const to = Math.max(1, Math.min(n, maxRank)) - 1;
    if (!unr && to === from) { num.textContent = prevText; return; }
    relocate(list, id, to, false, ol, { scroll: true });
  };
  inp.addEventListener("pointerdown", e => e.stopPropagation());
  inp.addEventListener("input", () => { inp.value = inp.value.replace(/\D/g, ""); });
  inp.addEventListener("keydown", e => {
    e.stopPropagation();
    if (e.key === "Enter") { e.preventDefault(); finish(true); }
    else if (e.key === "Escape") { e.preventDefault(); finish(false); num.focus(); }
  });
  inp.addEventListener("blur", () => finish(true));
}

/* inline edit */
function enterEdit(list, item, li, ol) {
  const body = li.querySelector(".row-body");
  if (!body) return;
  const wrap = el("div", "row-edit");
  const ti = el("input"); ti.type = "text"; ti.value = item.title; ti.maxLength = 200;
  ti.setAttribute("aria-label", "Entry title");
  const ni = el("input"); ni.type = "text"; ni.value = item.note || ""; ni.maxLength = 300;
  ni.placeholder = "Optional note"; ni.setAttribute("aria-label", "Entry note");
  const acts = el("div", "edit-actions");
  const save = el("button", "btn btn-accent");
  save.innerHTML = ICONS.save + "<span>Save</span>";
  const cancel = el("button", "btn btn-ghost", "Cancel");
  function commit() {
    const t = ti.value.trim();
    if (!t) { ti.focus(); return; }
    const n = ni.value.trim();
    const titleChanged = t !== item.title, noteChanged = n !== (item.note || "");
    if (!titleChanged && !noteChanged) { drawRows(list, ol); return; }
    History.push(list, "Edited “" + item.title + "”");
    item.title = t; item.note = n;
    if (noteChanged) delete item.noteAuto;
    if (titleChanged) { delete item.tried; delete item.tvmazeId; }
    persist(list);
    drawRows(list, ol);
    if (titleChanged && !item.img && !item.bg) {
      Media.bestMatch(list.template, t, contextTerms(list)).then(m => { if (m) applyMedia(list, item, m); }).catch(() => { });
    }
  }
  save.addEventListener("click", commit);
  cancel.addEventListener("click", () => drawRows(list, ol));
  const onKey = e => { if (e.key === "Enter") commit(); if (e.key === "Escape") drawRows(list, ol); };
  ti.addEventListener("keydown", onKey);
  ni.addEventListener("keydown", onKey);
  acts.append(save, cancel);
  wrap.append(ti, ni, acts);
  body.replaceWith(wrap);
  ti.focus();
  ti.select();
}

/* ============================================================
   SORTING — touch-first reordering.
   Touch: press and hold ~⅓ s and the row lifts in place (moving
   sooner just scrolls the page, as normal). Mouse: press and drag.
   Tap/click a rank number to type a new rank instead.
   While a row is held nothing in the DOM moves: the other rows glide
   aside on GPU transforms, then one commit writes the final order.
   ============================================================ */
let sortActive = false;
const NO_SORT = "button:not(.drag-handle), input, textarea, a, .row-style, .row-edit, .row-actions";

function attachSort(li, list, ol) {
  li.addEventListener("pointerdown", e => {
    if (e.pointerType !== "mouse" || e.button !== 0) return;
    if (e.target.closest(NO_SORT)) return;
    e.preventDefault();
    sortGesture(list, li, ol, e.clientX, e.clientY, "mouse", e.target);
  });
  li.addEventListener("touchstart", e => {
    if (e.touches.length !== 1 || e.target.closest(NO_SORT)) return;
    const t = e.touches[0];
    sortGesture(list, li, ol, t.clientX, t.clientY, "touch", e.target);
  }, { passive: true });
}

function sortGesture(list, li, ol, sx, sy, kind, target) {
  if (sortActive || li.querySelector(".row-edit, .rank-jump")) return;
  const onNum = !!(target.closest && target.closest(".rank-num"));
  const SLOP = kind === "touch" ? 10 : 5;
  let sorter = null, ended = false, pressT = 0, liftT = 0;

  if (kind === "touch") {
    pressT = setTimeout(() => li.classList.add("pressing"), 120);
    liftT = setTimeout(lift, 350);
  }
  function lift() {
    if (ended || sorter) return;
    clearTimeout(pressT);
    li.classList.remove("pressing");
    sorter = makeSorter(list, li, ol, sy);
    if (!sorter) { finish(); return; }
    vibrate(12);
    Sound.pickup();
  }
  function onMove(cx, cy, ev) {
    if (!sorter) {
      if (Math.hypot(cx - sx, cy - sy) <= SLOP) return;
      if (kind === "touch") { finish(); return; }   // finger moved first: it's a scroll
      lift();
      if (!sorter) return;
    }
    if (ev.cancelable) ev.preventDefault();          // held row: the page must not scroll
    sorter.move(cy);
  }
  const mm = e => onMove(e.clientX, e.clientY, e);
  const tm = e => { const t = e.touches[0]; if (t) onMove(t.clientX, t.clientY, e); };
  function up(e) {
    const s = sorter, wasTap = !sorter && !ended;
    finish();
    if (s) { s.drop(); return; }
    if (wasTap && onNum && e.type !== "touchcancel" && e.type !== "pointercancel") {
      if (e.type === "touchend" && e.cancelable) e.preventDefault(); // no ghost click
      openRankJump(list, li.dataset.id, ol);
    }
  }
  function finish() {
    if (ended) return;
    ended = true;
    clearTimeout(pressT); clearTimeout(liftT);
    li.classList.remove("pressing");
    if (kind === "mouse") {
      document.removeEventListener("pointermove", mm);
      document.removeEventListener("pointerup", up);
      document.removeEventListener("pointercancel", up);
    } else {
      document.removeEventListener("touchmove", tm);
      document.removeEventListener("touchend", up);
      document.removeEventListener("touchcancel", up);
    }
  }
  if (kind === "mouse") {
    document.addEventListener("pointermove", mm);
    document.addEventListener("pointerup", up);
    document.addEventListener("pointercancel", up);
  } else {
    document.addEventListener("touchmove", tm, { passive: false });
    document.addEventListener("touchend", up);
    document.addEventListener("touchcancel", up);
  }
}

function makeSorter(list, li, ol, startClientY) {
  const blocks = [...ol.children].filter(n =>
    n.classList.contains("rank-row") || n.classList.contains("milestone") || n.classList.contains("unranked-head"));
  const d = blocks.indexOf(li);
  if (d < 0) return null;
  sortActive = true;
  const sy0 = window.scrollY;
  const geo = blocks.map(b => {
    const r = b.getBoundingClientRect(), cs = getComputedStyle(b);
    return { top: r.top + sy0, h: r.height, mt: parseFloat(cs.marginTop) || 0, mb: parseFloat(cs.marginBottom) || 0 };
  });
  const GAP = parseFloat(getComputedStyle(ol).rowGap) || 12;
  const others = blocks.map((_, i) => i).filter(i => i !== d);
  const centers = others.map(i => geo[i].top + geo[i].h / 2);
  const startTop = geo[0].top - geo[0].mt;
  const startDocY = startClientY + sy0;
  let t = others.filter(i => i < d).length;
  let order = null, lastY = startClientY, raf = 0, alive = true;

  ol.classList.add("sorting");
  document.body.classList.add("drag-active");
  li.classList.add("lifted");

  function layout() {
    order = others.slice();
    order.splice(t, 0, d);
    const tops = new Array(blocks.length);
    let cur = startTop;
    for (const i of order) { tops[i] = cur + geo[i].mt; cur += geo[i].mt + geo[i].h + geo[i].mb + GAP; }
    return tops;
  }
  function apply() {
    const tops = layout();
    for (const i of others) {
      const dy = Math.round(tops[i] - geo[i].top);
      blocks[i].style.transform = dy ? "translate3d(0," + dy + "px,0)" : "";
    }
    let n = 0, unr = false;               // live numbering as rows make way
    for (const i of order) {
      const b = blocks[i];
      if (b.classList.contains("unranked-head")) { unr = true; continue; }
      if (!b.classList.contains("rank-row")) continue;
      const num = b.querySelector(".rank-num");
      if (num) num.textContent = unr ? "–" : String(++n);
    }
  }
  function position() {
    const dy = lastY + window.scrollY - startDocY;
    li.style.transform = "translate3d(0," + dy + "px,0) scale(1.03)";
    const center = geo[d].top + geo[d].h / 2 + dy;
    let nt = 0;
    for (const c of centers) if (center > c) nt++;
    if (nt !== t) {
      t = nt;
      apply();
      Sound.tick(Math.min(t + 1, 20));
      vibrate(5);
    }
  }
  function loop() {
    if (!alive) return;
    const edge = 96;
    let v = 0;
    if (lastY < edge) v = -Math.ceil((edge - lastY) / 5);
    else if (lastY > innerHeight - edge) v = Math.ceil((lastY - (innerHeight - edge)) / 5);
    if (v) { window.scrollBy(0, v); position(); }
    raf = requestAnimationFrame(loop);
  }
  apply();
  position();
  raf = requestAnimationFrame(loop);

  return {
    move(y) { lastY = y; position(); },
    drop() {
      alive = false;
      cancelAnimationFrame(raf);
      const tops = layout();
      li.classList.add("dropping");
      li.style.transform = "translate3d(0," + Math.round(tops[d] - geo[d].top) + "px,0) scale(1)";
      let committed = false;
      const commit = () => {
        if (committed) return;
        committed = true;
        sortActive = false;
        ol.classList.remove("sorting");
        document.body.classList.remove("drag-active");
        const ids = [], zone = {};
        let unr = false;
        for (const i of order) {
          const b = blocks[i];
          if (b.classList.contains("unranked-head")) { unr = true; continue; }
          if (b.classList.contains("rank-row")) { ids.push(b.dataset.id); zone[b.dataset.id] = unr; }
        }
        const id = li.dataset.id;
        const L = getList(list.id) || list;
        const from = L.items.findIndex(x => x.id === id);
        const it = L.items[from];
        const was = !!(it && it.unranked), now = !!zone[id];
        const sig = arr => arr.map(x => x.id + (x.unranked ? "u" : "")).join();
        const before = sig(L.items);
        const after = ids.map(i => i + (zone[i] ? "u" : "")).join();
        const changed = !!it && before !== after && ids.length === L.items.length;
        if (changed) {
          History.push(L, now && !was ? "Unranked “" + it.title + "”" : !now && was ? "Ranked “" + it.title + "”" : "Moved “" + it.title + "”");
          const byId = new Map(L.items.map(x => [x.id, x]));
          L.items = ids.map(i => byId.get(i));
          for (const x of L.items) { if (zone[x.id]) x.unranked = true; else delete x.unranked; }
          normalize(L);
          persist(L);
        }
        drawRows(L, ol);
        Sound.drop();
        vibrate([10, 30, 8]);
        if (changed) {
          const to = L.items.findIndex(x => x.id === id);
          if (was && !now) badge(ol, id, "new", "★ #" + (to + 1));
          else if (!was && now) badge(ol, id, "down", "unranked");
          else if (!now && to !== from) badge(ol, id, to < from ? "up" : "down", (to < from ? "▲ " : "▼ ") + Math.abs(from - to));
          announce(it.title + (now ? " moved to Unranked" : " is now number " + (to + 1)));
        }
      };
      li.addEventListener("transitionend", e => { if (e.propertyName === "transform") commit(); });
      setTimeout(commit, 340);
    },
  };
}

/* ============================================================
   QUICK MATCHUPS — a surprise head-to-head every so often.
   Two shows from your list, one tap. Pick the lower-ranked one and
   it jumps above the other; pick an Unranked one and a few quick
   taps slot it into the ranking. Toggle in Options.
   ============================================================ */
const Quick = (() => {
  let timer = 0, lastAct = Date.now(), panel = null, listId = null, keyH = null;
  const asked = new Set();
  ["pointerdown", "keydown", "scroll", "touchstart", "wheel"].forEach(ev =>
    window.addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true, capture: true }));
  const enabled = () => state.settings.quick !== false;
  const ACT_IDLE = 5000;

  function schedule(ms) { clearTimeout(timer); timer = setTimeout(tryShow, ms); }
  function start(list) {
    listId = list.id;
    close(true);
    if (enabled()) schedule(40000 + Math.random() * 30000);
  }
  function stop() { clearTimeout(timer); close(true); listId = null; }
  function busyNow() {
    const ae = document.activeElement;
    return !!(document.querySelector(".modal-veil, .sugg-panel, .row-edit, .rank-jump, .row-style, .opt-menu") ||
      document.body.classList.contains("drag-active") ||
      (ae && (ae.isContentEditable || /^(INPUT|TEXTAREA)$/.test(ae.tagName))) ||
      document.visibilityState !== "visible");
  }
  function tryShow() {
    if (!listId || View.listId !== listId || !enabled()) return;
    if (busyNow() || Date.now() - lastAct < ACT_IDLE) { schedule(7000); return; }
    if (!open(false)) schedule(150000);
  }

  /* what to ask: an Unranked entry to place, or two nearby ranked ones */
  function pickTask(L) {
    const rc = rankedCount(L);
    const unr = L.items.filter(it => it.unranked);
    if (unr.length && rc >= 1 && (rc < 2 || Math.random() < .55)) {
      return { mode: "place", item: unr[Math.floor(Math.random() * unr.length)] };
    }
    if (rc < 2) return null;
    for (let tries = 0; tries < 12; tries++) {
      const i = Math.floor(Math.random() * (rc - 1));
      const gap = 1 + Math.floor(Math.random() * Math.min(4, rc - 1 - i));
      const a = L.items[i], b = L.items[i + gap];
      const key = [a.id, b.id].sort().join("|");
      if (asked.has(key) && tries < 11) continue;
      asked.add(key);
      return { mode: "pair", a, b };
    }
    return null;
  }

  function tile(item, rankText) {
    const b = el("button", "q-pick");
    b.type = "button";
    const c1 = item.c1 || Media.hashColors(item.title).c1;
    b.style.setProperty("--c1", c1);
    const art = el("div", "q-art");
    const src = item.img || item.imgHi;
    if (src) {
      const im = el("img"); im.src = src; im.alt = ""; im.draggable = false;
      im.addEventListener("error", () => { im.remove(); art.textContent = (item.title[0] || "?").toUpperCase(); }, { once: true });
      art.appendChild(im);
    } else art.textContent = (item.title[0] || "?").toUpperCase();
    const txt = el("div", "q-txt");
    txt.append(el("div", "q-rank", rankText), el("div", "q-name", item.title));
    b.append(art, txt);
    b.setAttribute("aria-label", "Pick " + item.title);
    return b;
  }

  function open(force) {
    const L = listId && getList(listId);
    const ol = document.getElementById("rankList");
    if (!L || !ol) return false;
    const task = pickTask(L);
    if (!task) { if (force) toast("Add a couple more shows first"); return false; }
    close(true);
    panel = el("div", "quick");
    panel.setAttribute("role", "dialog");
    panel.setAttribute("aria-label", "Quick matchup");
    const head = el("div", "q-head");
    const kick = el("span", "q-kicker");
    kick.innerHTML = ICONS.bolt + "<span>Quick matchup</span>";
    const sub = el("span", "q-sub", "Tap the better one");
    const x = el("button", "q-x");
    x.innerHTML = ICONS.x;
    x.setAttribute("aria-label", "Not now");
    x.addEventListener("click", () => { close(); schedule(300000); });
    head.append(kick, sub, x);
    const stage = el("div", "q-stage");
    const foot = el("div", "q-foot");
    const skip = el("button", "q-skip", "Too close to call");
    const prog = el("span", "q-prog");
    foot.append(skip, prog);
    panel.append(head, stage, foot);
    document.body.appendChild(panel);
    requestAnimationFrame(() => requestAnimationFrame(() => panel && panel.classList.add("open")));
    Sound.pop();

    let busy = false, pickFn = null;
    const show = (left, right, lt, rt, onPick) => {
      stage.innerHTML = "";
      const A = tile(left, lt), B = tile(right, rt);
      stage.append(A, el("span", "q-vs", "vs"), B);
      panel.style.setProperty("--qa", left.c1 || Media.hashColors(left.title).c1);
      panel.style.setProperty("--qb", right.c1 || Media.hashColors(right.title).c1);
      Ambient.focus([left.c1, right.c1, left.c2 || right.c2].filter(Boolean));
      pickFn = leftWon => {
        if (busy) return;
        busy = true;
        (leftWon ? A : B).classList.add("win");
        (leftWon ? B : A).classList.add("lose");
        Sound.tick(8);
        vibrate(8);
        setTimeout(() => { busy = false; onPick(leftWon); }, 420);
      };
      A.addEventListener("click", () => pickFn(true));
      B.addEventListener("click", () => pickFn(false));
    };
    const done = (msg, delay) => {
      pickFn = null;
      stage.innerHTML = "";
      stage.appendChild(el("div", "q-result", msg));
      skip.style.visibility = "hidden";
      setTimeout(() => close(), delay || 1300);
      schedule(100000 + Math.random() * 80000);
    };
    keyH = e => {
      if (!pickFn || document.querySelector(".modal-veil")) return;
      const t = e.target;
      if (t && (t.isContentEditable || /^(INPUT|TEXTAREA)$/.test(t.tagName))) return;
      if (e.key === "ArrowLeft" || e.key === "1") { e.preventDefault(); pickFn(true); }
      else if (e.key === "ArrowRight" || e.key === "2") { e.preventDefault(); pickFn(false); }
      else if (e.key === "Escape") { e.preventDefault(); close(); schedule(300000); }
    };
    document.addEventListener("keydown", keyH);

    if (task.mode === "pair") {
      const { a, b } = task;
      const ia = L.items.indexOf(a), ib = L.items.indexOf(b);
      sub.textContent = "Which do you rank higher?";
      skip.addEventListener("click", () => done("Fair — they stay where they are", 900));
      show(a, b, "#" + (ia + 1), "#" + (ib + 1), aWon => {
        const LL = getList(L.id), olNow = document.getElementById("rankList");
        if (!LL || !olNow) return close();
        const ca = LL.items.findIndex(x => x.id === a.id), cb = LL.items.findIndex(x => x.id === b.id);
        if (ca < 0 || cb < 0) return close();
        if (aWon) { done("Agreed — " + a.title + " stays ahead"); return; }
        // the lower one won: it moves directly above the other
        relocate(LL, b.id, ca, false, olNow, { quietToast: true });
        const row = rowEl(olNow, b.id);
        if (row) { addBloom(row); flashRow(row); }
        done(b.title + " moves up to #" + (ca + 1));
      });
    } else {
      /* place an Unranked entry: binary insertion, a tap at a time */
      const me = task.item;
      const others = L.items.filter(x => !x.unranked && x.id !== me.id);
      let lo = 0, hi = others.length, round = 0;
      const total = Math.ceil(Math.log2(others.length + 1));
      skip.textContent = "Not now";
      skip.addEventListener("click", () => { close(); schedule(300000); });
      const step = () => {
        if (lo >= hi) {
          const LL = getList(L.id), olNow = document.getElementById("rankList");
          if (!LL || !olNow) return close();
          relocate(LL, me.id, lo, false, olNow, { quietToast: true });
          const row = rowEl(olNow, me.id);
          if (row) { addBloom(row); flashRow(row); if (row.scrollIntoView) row.scrollIntoView({ block: "center", behavior: "smooth" }); }
          Sound.win();
          done(me.title + " is ranked #" + (lo + 1), 1600);
          return;
        }
        round++;
        const mid = (lo + hi) >> 1;
        const opp = others[mid];
        sub.textContent = "Placing a show you've seen";
        prog.textContent = round + " of ~" + total;
        show(me, opp, "Unranked", "#" + (mid + 1), meWon => {
          if (meWon) hi = mid; else lo = mid + 1;
          step();
        });
      };
      step();
    }
    return true;
  }

  function close(instant) {
    if (keyH) { document.removeEventListener("keydown", keyH); keyH = null; }
    if (!panel) return;
    const p = panel;
    panel = null;
    Ambient.release();
    if (instant) { p.remove(); return; }
    p.classList.remove("open");
    setTimeout(() => p.remove(), 450);
  }
  return { start, stop, now: () => open(true), close };
})();

/* ============================================================
   HEAD-TO-HEAD — binary insertion against the ranked entries
   ============================================================ */
function duelCard(item, tag) {
  const b = el("button", "duel-card");
  b.type = "button";
  const c1 = item.c1 || Media.hashColors(item.title).c1;
  b.style.setProperty("--c1", c1);
  b.style.setProperty("--c2", item.c2 || darken(c1, .35));
  const art = el("div", "duel-art");
  const initial = (String(item.title).trim()[0] || "?").toUpperCase();
  const src = item.imgHi || item.img || item.bg;
  if (src) {
    const im = el("img"); im.src = src; im.alt = "";
    im.addEventListener("error", () => { im.remove(); art.textContent = initial; }, { once: true });
    art.appendChild(im);
  } else art.textContent = initial;
  const info = el("div", "duel-info");
  info.append(el("div", "duel-tag", tag), el("div", "duel-name", item.title));
  if (item.note) info.appendChild(el("div", "duel-note", item.note));
  b.append(art, info);
  b.setAttribute("aria-label", "Pick " + item.title);
  return b;
}
function openDuel(listRef, itemId, opts) {
  opts = opts || {};
  const list = getList(listRef.id);
  if (!list) return;
  const item0 = list.items.find(x => x.id === itemId);
  const others = list.items.filter(x => x.id !== itemId && !x.unranked);
  if (!item0) return;
  const ol0 = document.getElementById("rankList");
  if (!others.length) { relocate(list, itemId, 0, false, ol0); if (opts.onFinish) opts.onFinish(); return; }
  const wasUnranked = !!item0.unranked;
  const startIdx = list.items.indexOf(item0);
  let lo = 0, hi = others.length, round = 0, busy = false, cardA = null, cardB = null, finished = false;
  const total = Math.ceil(Math.log2(others.length + 1));
  const m = makeModal("duel", e => {
    if (busy) return;
    if (e.key === "ArrowLeft" || e.key === "1") { e.preventDefault(); pick(true); }
    else if (e.key === "ArrowRight" || e.key === "2") { e.preventDefault(); pick(false); }
  });
  m.veil.classList.add("duel-veil");
  m.onClose = () => { Ambient.release(); if (opts.onDone) opts.onDone(); if (finished && opts.onFinish) setTimeout(opts.onFinish, 350); };
  const md = m.modal;
  md.appendChild(el("div", "eyebrow", "Head-to-head"));
  const h2 = el("h2", null, "Which one's better?");
  md.appendChild(h2);
  const hint = el("p", "hint");
  md.appendChild(hint);
  const meter = el("div", "duel-meter");
  const fill = el("div", "duel-fill");
  meter.appendChild(fill);
  md.appendChild(meter);
  const stage = el("div", "duel-stage");
  md.appendChild(stage);
  const foot = el("div", "modal-actions");
  foot.appendChild(el("span", "duel-keys", "← / → or 1 / 2 to pick · Esc to stop"));
  const stop = el("button", "btn btn-ghost", wasUnranked ? "Leave it unranked" : "Keep it at #" + (startIdx + 1));
  stop.addEventListener("click", m.close);
  foot.appendChild(stop);
  md.appendChild(foot);

  function render() {
    if (lo >= hi) return finish();
    round++;
    const mid = (lo + hi) >> 1;
    const opp = others[mid];
    const live = getList(list.id) || list;
    const me = live.items.find(x => x.id === itemId) || item0;
    hint.textContent = "Matchup " + round + " of about " + total + " · it lands somewhere from #" + (lo + 1) + " to #" + (hi + 1);
    fill.style.width = Math.min(96, ((round - 1) / total) * 100) + "%";
    stage.innerHTML = "";
    cardA = duelCard(me, wasUnranked ? "Placing" : "Re-ranking");
    cardB = duelCard(opp, "Currently #" + (live.items.indexOf(opp) + 1));
    cardA.addEventListener("click", () => pick(true));
    cardB.addEventListener("click", () => pick(false));
    stage.append(cardA, el("div", "duel-vs", "vs"), cardB);
    const ca = me.c1 || Media.hashColors(me.title).c1, cb = opp.c1 || Media.hashColors(opp.title).c1;
    m.veil.style.setProperty("--v1", ca);
    m.veil.style.setProperty("--v2", cb);
    Ambient.focus([ca, cb, me.c2 || opp.c2 || ca]);
    anim(stage, [{ opacity: 0, transform: "translateY(10px) scale(.99)" }, { opacity: 1, transform: "none" }], { duration: 320, easing: "cubic-bezier(.2,1.2,.35,1)" });
  }
  function pick(meBetter) {
    if (busy || lo >= hi) return;
    busy = true;
    const mid = (lo + hi) >> 1;
    if (meBetter) hi = mid; else lo = mid + 1;
    (meBetter ? cardA : cardB).classList.add("win");
    (meBetter ? cardB : cardA).classList.add("lose");
    const wc = (meBetter ? cardA : cardB).style.getPropertyValue("--c1");
    if (wc) { m.veil.style.setProperty("--v1", wc); m.veil.style.setProperty("--v2", wc); }
    Sound.tick(round + 4);
    setTimeout(() => { busy = false; render(); }, 300);
  }
  function finish() {
    fill.style.width = "100%";
    finished = true;
    const to = lo;
    m.close();
    const live = getList(list.id);
    const ol = document.getElementById("rankList");
    if (!live || !ol || ol.dataset.listId !== live.id) return;
    const cur = live.items.findIndex(x => x.id === itemId);
    if (cur < 0) return;
    Sound.win();
    if (!wasUnranked && to === cur) {
      const row = rowEl(ol, itemId);
      if (row) { if (row.scrollIntoView) row.scrollIntoView({ block: "center", behavior: "smooth" }); flashRow(row); }
      toast("Settled: stays at #" + (cur + 1));
      return;
    }
    relocate(live, itemId, to, false, ol, { scroll: true });
    addBloom(rowEl(ol, itemId));
    if (!opts.chain) toast("Settled at #" + (to + 1) + " after " + plural(round, "matchup"));
  }
  render();
}

/* ============================================================
   ARTWORK PICKER — official gallery + "different title?" search
   ============================================================ */
function openArtPicker(listRef, itemRef) {
  const m = makeModal("picker");
  const md = m.modal;
  const getItem = () => { const l = getList(listRef.id); return l && l.items.find(x => x.id === itemRef.id); };
  const list0 = getList(listRef.id) || listRef;
  md.appendChild(el("div", "eyebrow", "Artwork"));
  md.appendChild(el("h2", null, itemRef.title));
  md.appendChild(el("p", "hint", isTv(list0)
    ? "Choose the poster that feels most like the show — the row's glow re-samples from it. Pick a backdrop to give the row a Scene. Wrong show entirely? Search below."
    : "Wrong edition or wrong cover? Choose the match you meant — the row re-samples its colors from the new art."));

  const gallery = el("div");
  md.appendChild(gallery);

  const searchSec = el("div", "pick-sec");
  searchSec.appendChild(el("h5", null, isTv(list0) ? "Different show?" : "Search"));
  const inp = el("input");
  inp.type = "text"; inp.value = itemRef.title; inp.autocomplete = "off";
  inp.setAttribute("aria-label", "Search for artwork");
  searchSec.appendChild(inp);
  const status = el("div", "sugg-status", "");
  status.style.padding = "10px 2px 4px";
  searchSec.appendChild(status);
  const grid = el("div", "pick-grid");
  searchSec.appendChild(grid);
  md.appendChild(searchSec);

  const acts = el("div", "modal-actions");
  const rm = el("button", "btn btn-ghost", "Remove artwork");
  const close = el("button", "btn", "Done");
  acts.append(rm, close);
  md.appendChild(acts);
  close.addEventListener("click", m.close);
  rm.disabled = !(itemRef.img || itemRef.bg);
  rm.addEventListener("click", () => {
    const list = getList(listRef.id), item = getItem();
    if (!list || !item) return m.close();
    History.push(list, "Removed artwork from “" + item.title + "”");
    delete item.img; delete item.imgHi; delete item.bg; delete item.source;
    if (!item.custom) { const h = Media.hashColors(item.title); item.c1 = h.c1; item.c2 = h.c2; item.palette = []; }
    if (item.look === "scene" || item.look === "glow") item.look = "tint";
    item.tried = 1;
    persist(list);
    refreshRow(list, item);
    m.close();
    toast("Artwork removed");
  });

  /* official gallery for TV shows */
  (async () => {
    if (!isTv(list0)) return;
    const it = getItem();
    if (!it) return;
    let showId = it.tvmazeId;
    gallery.innerHTML = '<div class="sugg-status"><span class="spin"></span><span>Loading the official artwork…</span></div>';
    try {
      if (!showId) {
        const s = await Tv.get("/singlesearch/shows?q=" + enc(it.title));
        showId = s && s.id;
      }
      if (!showId) { gallery.innerHTML = ""; return; }
      const im = await Media.tvImages(showId);
      gallery.innerHTML = "";
      const section = (title, arr, kind, wide) => {
        if (!arr.length) return;
        const sec = el("div", "pick-sec");
        sec.appendChild(el("h5", null, title));
        const g = el("div", "pick-grid" + (wide ? " wide" : ""));
        arr.slice(0, wide ? 9 : 14).forEach((a, i) => {
          const b = el("button", "pick");
          b.type = "button";
          const cur = getItem();
          if (cur && ((kind === "poster" && (cur.imgHi === a.imgHi || cur.img === a.img)) || (kind === "bg" && cur.bg === a.imgHi))) b.classList.add("current");
          const art = el("div", "p-art");
          const img = el("img"); img.src = a.img; img.alt = ""; img.loading = "lazy";
          img.addEventListener("error", () => b.remove(), { once: true });
          art.appendChild(img);
          if (a.main || i === 0) art.appendChild(el("span", "p-tag", a.main ? "Official" : "Top pick"));
          b.appendChild(art);
          b.addEventListener("click", async () => {
            g.querySelectorAll(".pick").forEach(x => x.classList.remove("current"));
            b.classList.add("current");
            const L = getList(listRef.id);
            if (L) await applyArt(L, itemRef, a, kind);
          });
          g.appendChild(b);
        });
        sec.appendChild(g);
        gallery.appendChild(sec);
      };
      section("Posters", im.posters, "poster", false);
      section("Backdrops", im.backdrops, "bg", true);
    } catch { gallery.innerHTML = ""; }
  })();

  let tok = 0;
  async function run() {
    const q = inp.value.trim();
    if (q.length < 2) { grid.innerHTML = ""; status.textContent = ""; return; }
    const my = ++tok;
    status.innerHTML = '<span class="spin"></span><span>Searching…</span>';
    let res = [], failed = false;
    const list = getList(listRef.id) || listRef;
    try { res = await Media.search(list.template, q, contextTerms(list), { prefix: true }); } catch { failed = true; }
    if (my !== tok) return;
    grid.innerHTML = "";
    status.textContent = failed ? "Lookup failed — are you online?" :
      res.length ? plural(res.length, "match", "matches") + " · pick one to switch to it" : "No matches — try other words (add a year or artist)";
    const cur = getItem();
    res.slice(0, 18).forEach(r => {
      const b = el("button", "pick");
      b.type = "button";
      if (cur && r.img && (r.img === cur.img || (r.id && r.id === cur.tvmazeId))) b.classList.add("current");
      const art = el("div", "p-art");
      if (r.img) {
        const im = el("img"); im.src = r.img; im.alt = ""; im.loading = "lazy";
        im.addEventListener("error", () => { im.remove(); art.innerHTML = ICONS.photo; }, { once: true });
        art.appendChild(im);
      } else art.innerHTML = ICONS.photo;
      const info = el("div", "p-info");
      info.append(el("div", "p-name", r.name));
      if (r.sub) info.appendChild(el("div", "p-sub", r.sub));
      info.appendChild(el("div", "p-src", r.source));
      b.append(art, info);
      b.addEventListener("click", async () => {
        grid.querySelectorAll(".pick").forEach(x => { x.disabled = true; });
        status.textContent = "Applying…";
        const L = getList(listRef.id), item = getItem();
        if (!L || !item) return m.close();
        History.push(L, "New artwork for “" + item.title + "”");
        if (r.source === "TVMaze") delete item.bg;
        const hasArt = await applyMedia(L, item, r, { force: true, replaceNote: true });
        m.close();
        toast(hasArt ? "Artwork updated" : "That match has no artwork — kept its colors and note");
      });
      grid.appendChild(b);
    });
  }
  inp.addEventListener("input", debounce(run, 300));
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); run(); } });
  if (!isTv(list0)) run();
  else status.textContent = "Type a title and press Enter to search";
  if (!isTv(list0)) { inp.focus(); inp.select(); }
}

/* ============================================================
   IMPORT / EXPORT
   ============================================================ */
function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "alltimers-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("Backup downloaded");
}
function importJSON() {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "application/json,.json";
  inp.addEventListener("change", () => {
    const f = inp.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!data || data.version !== 1 || !Array.isArray(data.lists)) throw new Error("bad shape");
        History.push(null, "Imported lists");
        const tmp = migrate({ version: 1, lists: data.lists.filter(l => l && typeof l === "object"), settings: {} });
        let n = 0;
        for (const l of tmp.lists) {
          l.id = uid();
          l.title = String(l.title || "Untitled list");
          l.subtitle = String(l.subtitle || "");
          if (!THEMES.some(t => t.id === l.theme)) l.theme = "studio";
          if (!TEMPLATES.some(t => t.id === l.template)) l.template = "custom";
          l.items = l.items.filter(it => it && it.title);
          for (const it of l.items) { it.id = uid(); it.title = String(it.title); it.note = String(it.note || ""); }
          l.createdAt = l.createdAt || Date.now();
          l.updatedAt = Date.now();
          state.lists.push(l);
          n++;
        }
        persist();
        renderHome();
        toast("Imported " + plural(n, "list"), { action: { label: "Undo", fn: () => History.undo() } });
      } catch { toast("Couldn't read that file — expected an ALL·TIMERS backup"); }
    };
    r.readAsText(f);
  });
  inp.click();
}

/* ------------------------------ keyboard ------------------- */
document.addEventListener("keydown", e => {
  if (document.querySelector(".modal-veil")) return;
  const t = e.target;
  const typing = t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
  const mod = e.metaKey || e.ctrlKey;
  const k = (e.key || "").toLowerCase();
  if (mod && !e.altKey && k === "z" && !typing) { e.preventDefault(); if (e.shiftKey) History.redo(); else History.undo(); }
  else if (mod && !e.altKey && k === "y" && !typing) { e.preventDefault(); History.redo(); }
  else if (!mod && !e.altKey && e.key === "/" && !typing && View.listId) {
    const a = document.querySelector(".add-title-input");
    if (a) { e.preventDefault(); a.focus(); }
  }
});

/* ------------------------------ boot ----------------------- */
route();
(async () => {
  if (!(await API.ping())) return;
  route({ keepScroll: true, quiet: true });
  if (!API.token) {
    // first visit with accounts on: a friendly invitation (once)
    if (!localStorage.getItem("alltimers.welcomed")) setTimeout(() => {
      if (!API.user && !document.querySelector(".modal-veil")) openAuthModal("register", { welcome: true });
    }, 700);
    return;
  }
  // a saved session: this device already knows who you are
  try {
    const remote = await API.load();
    if (!API.token) {
      route({ keepScroll: true, quiet: true });
      toast("Your session ended — sign in again", { action: { label: "Sign in", fn: () => openAuthModal("login") } });
      return;
    }
    if (remote && Array.isArray(remote.lists)) {
      if (remote.lists.length === 0 && state.lists.length > 0) await API.save(state);
      else { state = migrate(remote); Store.save(state, cacheKey()); History.clear(); }
      setSync("saved");
      route({ keepScroll: true, quiet: true });
      if (!sessionStorage.getItem("alltimers.greeted")) {
        sessionStorage.setItem("alltimers.greeted", "1");
        toast("Welcome back, " + API.user);
      }
    }
  } catch { setSync("offline"); }
})();
